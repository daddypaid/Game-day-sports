<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<title>GameDay Premium</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050706;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);height:100dvh;background:linear-gradient(180deg,#080a08,#030403)}.side{background:linear-gradient(180deg,#090b09,#050605 72%);border-right:1px solid #5a4318;padding:16px 12px;overflow:auto;box-shadow:12px 0 35px rgba(0,0,0,.42)}.logo{font:900 21px/1 Georgia,serif;color:#f5ce63;padding:8px 8px 18px;border-bottom:1px solid #322913}.logo small{display:block;font:700 8px/1.4 Arial,sans-serif;color:#fff;letter-spacing:.22em;margin-top:4px}.side a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#d6d1c3;padding:11px 10px;border-radius:10px;margin:4px 0;border:1px solid transparent;font-size:12px;font-weight:800}.side a .ico{width:22px;text-align:center;color:#f2c65c;font-size:16px}.side a.active{background:linear-gradient(90deg,#6b4c13,#2c1e08);border-color:#d6a940;color:#fff3bb;box-shadow:0 0 18px rgba(227,181,64,.13)}.divider{height:1px;background:#2f2816;margin:12px 6px}.responsible{margin:16px 5px 0;padding:12px;border:1px solid #5a4318;border-radius:11px;text-align:center;color:#d9d3c3;font-size:9px;line-height:1.55}.responsible strong{display:block;color:#f3cb61;font:900 11px Georgia,serif;margin-bottom:5px}.stage{position:relative;min-width:0;background:#040504}.bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #5a4318;background:linear-gradient(180deg,#0c0f0c,#070807);box-shadow:0 8px 24px rgba(0,0,0,.35);position:relative;z-index:2}.title{font:900 17px Georgia,serif;color:#f5d06b}.wallet{padding:8px 12px;border-radius:10px;border:1px solid #2aa85d;background:linear-gradient(180deg,#0d4627,#072516);color:#caffdc;font-weight:900;font-size:12px;box-shadow:0 0 18px rgba(40,220,116,.18);white-space:nowrap}.frame{width:100%;height:calc(100dvh - 54px);border:0;background:#050706;display:block}.mobile-menu{display:none}@media(max-width:899px){.shell{display:block}.side{position:fixed;z-index:30;left:-230px;top:0;bottom:0;width:215px;transition:.2s;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}.shell.menu-open .side{left:0}.bar{height:calc(50px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-left:54px}.frame{height:calc(100dvh - 50px - env(safe-area-inset-top))}.mobile-menu{display:block;position:fixed;z-index:40;left:10px;top:calc(8px + env(safe-area-inset-top));width:36px;height:34px;border-radius:9px;border:1px solid #6c511e;background:#12150f;color:#f1ca61;font-size:20px}.wallet{font-size:10px;padding:7px 9px}.title{font-size:15px}}
</style>
</head>
<body>
<div id="shell" class="shell">
<button id="menu" class="mobile-menu" aria-label="Menu">☰</button>
<aside class="side">
<div class="logo">♛ GAMEDAY<small>SPORTS & CASINO</small></div>
<a data-page="sportsbook" class="active" href="gameday-sportsbook.html"><span class="ico">◉</span>Sportsbook</a>
<a data-page="casino" href="gameday-casino-v2.html"><span class="ico">♛</span>Casino</a>
<a data-page="bets" href="gameday-my-bets.html"><span class="ico">▤</span>My Bets</a>
<a data-page="account" href="gameday-auth.html"><span class="ico">●</span>My Account</a>
<div class="divider"></div>
<a data-page="slots" href="gameday-slots-lobby.html"><span class="ico">777</span>Slots</a>
<a data-page="blackjack" href="gameday-blackjack.html"><span class="ico">A♠</span>Blackjack</a>
<a data-page="roulette" href="gameday-roulette.html"><span class="ico">◉</span>Roulette</a>
<a data-page="poker" href="gameday-poker.html"><span class="ico">♠</span>Poker</a>
<div class="responsible"><strong>PLAY RESPONSIBLY</strong>TEST MODE<br>NO REAL MONEY</div>
</aside>
<section class="stage"><div class="bar"><div id="title" class="title">GameDay Sportsbook</div><div id="shellWallet" class="wallet">TEST MODE</div></div><iframe id="app" class="frame" src="gameday-sportsbook.html" title="GameDay"></iframe></section>
</div>
<script>
const frame=document.getElementById('app'),shell=document.getElementById('shell'),title=document.getElementById('title'),shellWallet=document.getElementById('shellWallet');
const names={sportsbook:'GameDay Sportsbook',casino:'GameDay Casino',bets:'My Bets',account:'My Account',slots:'GameDay Slots',blackjack:'GameDay Blackjack',roulette:'GameDay Roulette',baccarat:'GameDay Baccarat',poker:'GameDay Poker'};
function idFor(url){url=String(url||'');if(url.includes('casino-v2'))return'casino';if(url.includes('my-bets'))return'bets';if(url.includes('auth'))return'account';if(url.includes('slots-lobby')||url.endsWith('gameday-slots.html')||url.includes('midnight-monsters')||url.includes('galactic-rebellion'))return'slots';if(url.includes('blackjack'))return'blackjack';if(url.includes('roulette'))return'roulette';if(url.includes('baccarat'))return'baccarat';if(url.includes('video-poker')||url.includes('bonus-poker')||url.includes('deuces-wild')||url.includes('three-card-poker')||url.includes('ultimate-texas-holdem')||url.includes('caribbean-stud')||url.includes('poker'))return'poker';return'sportsbook'}
const pokerGamePaths=['gameday-video-poker.html','gameday-bonus-poker.html','gameday-deuces-wild.html','gameday-three-card-poker.html','gameday-ultimate-texas-holdem.html','gameday-caribbean-stud.html'];
const exactTitles={'gameday-video-poker.html':'GameDay Jacks or Better','gameday-baccarat.html':'GameDay Baccarat','gameday-midnight-monsters-v2.html':'Midnight Monsters','gameday-galactic-rebellion-v2.html':'Galactic Rebellion','gameday-slots.html':'GameDay Lucky 7s','gameday-slots-lobby.html':'GameDay Slots'};
function cleanBalance(t){t=String(t||'').trim();if(!t||/checking|unavailable|not signed|—/i.test(t))return'';const m=t.match(/\$\s?[0-9,]+(?:\.\d{2})?/);return m?m[0].replace(/\s+/g,''):''}
function bindWallet(d){const candidates=['#balance','#wallet','#walletBalance'];const update=()=>{let value='';for(const s of candidates){const el=d.querySelector(s);value=cleanBalance(el?.textContent);if(value)break}shellWallet.textContent=value?`TEST ${value}`:'TEST MODE'};update();candidates.forEach(s=>{const el=d.querySelector(s);if(el)new MutationObserver(update).observe(el,{childList:true,characterData:true,subtree:true})})}
document.querySelectorAll('.side a[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();frame.src=a.getAttribute('href');shell.classList.remove('menu-open')}));document.getElementById('menu').onclick=()=>shell.classList.toggle('menu-open');
frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;['gameday-premium-app.css','gameday-premium-game-art.css','gameday-premium-roulette-poker.css','gameday-premium-baccarat-poker.css','gameday-premium-account-bets.css','gameday-premium-sportsbook.css','gameday-premium-in-shell.css'].forEach(href=>{if(!d.querySelector(`link[href="${href}"]`)){const l=d.createElement('link');l.rel='stylesheet';l.href=href;d.head.appendChild(l)}});d.body.classList.add('gd-premium','gd-in-shell');const path=String(w.location.pathname||''),file=path.split('/').pop()||'',id=idFor(path);d.body.classList.toggle('gd-art-sportsbook',file==='gameday-sportsbook.html');d.body.classList.toggle('gd-art-blackjack',file==='gameday-blackjack.html');d.body.classList.toggle('gd-art-video-poker',file==='gameday-video-poker.html');d.body.classList.toggle('gd-art-roulette',file==='gameday-roulette.html');d.body.classList.toggle('gd-art-baccarat',file==='gameday-baccarat.html');d.body.classList.toggle('gd-art-poker-room',file==='gameday-poker.html');d.body.classList.toggle('gd-art-poker-game',pokerGamePaths.includes(file));d.body.classList.toggle('gd-art-my-bets',file==='gameday-my-bets.html');d.body.classList.toggle('gd-art-account',file==='gameday-auth.html');title.textContent=exactTitles[file]||(names[id]||'GameDay');document.querySelectorAll('.side a[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===id));bindWallet(d);if(id==='sportsbook'&&!d.querySelector('.gd-premium-hero')){const h=d.createElement('section');h.className='gd-premium-hero';h.innerHTML='<div class="copy"><div class="kicker">Bigger games • bigger moments</div><h2>GameDay Sportsbook</h2><p>Live lines, props, futures and in-play action from the shared GameDay test wallet.</p><div class="gd-athletes"><span>Wemby</span><span>Patrick Mahomes</span><span>Aaron Judge</span><span>Lionel Messi</span></div><a class="gd-hero-action" href="#content">VIEW LIVE LINES ›</a></div>';d.querySelector('main')?.prepend(h)}if(id==='casino'&&!d.querySelector('.gd-premium-hero')){const h=d.createElement('section');h.className='gd-premium-hero';h.innerHTML='<div class="copy"><div class="kicker">GameDay premium casino</div><h2>Slots. Blackjack. Roulette. Poker.</h2><p>Only the games already inside GameDay, presented in one premium black-and-gold system.</p><div class="gd-athletes"><span>Midnight Monsters</span><span>Galactic Rebellion</span><span>Lucky 7s</span><span>Poker Room</span></div><a class="gd-hero-action" href="#featured">BROWSE GAMES ›</a></div>';d.querySelector('main')?.prepend(h)}}catch(e){console.warn('premium shell',e)}});
</script>
</body></html>
