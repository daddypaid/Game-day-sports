<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GameDay Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e0b;color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#101712;border-bottom:1px solid #27342c;padding:14px}h1{margin:0;font-size:23px}.sub{margin-top:5px;color:#94a198;font-size:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.nav a{text-decoration:none;text-align:center;padding:10px 6px;border-radius:9px;background:#202b24;color:#fff;font-weight:bold;font-size:12px}.nav a.active{background:#eef5f0;color:#07100a}main{max-width:520px;margin:auto;padding:16px}.card{background:#131b16;border:1px solid #2b3a31;border-radius:14px;padding:16px;margin-bottom:14px}.status{padding:12px;border-radius:10px;background:#141c17;border:1px solid #2b3a31;color:#b7c2ba;margin-bottom:14px}.success{border-color:#316643;color:#bff1ca}.error{border-color:#733b3b;color:#efb4b4}label{display:block;margin:12px 0 6px;font-size:12px;color:#b6c1b9}input{width:100%;border:1px solid #34453a;border-radius:9px;padding:13px;background:#0c130f;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:12px;font-size:15px;font-weight:bold;cursor:pointer}.primary{background:#eef5f0;color:#07100a}.danger{background:#392020;color:#f2c1c1}.hidden{display:none}.email{font-size:18px;font-weight:bold;margin:8px 0}.link{display:block;text-align:center;text-decoration:none;background:#163d22;color:#bff1ca;border:1px solid #2c7442;border-radius:10px;padding:13px;font-weight:bold;margin-top:12px}@media(max-width:430px){.nav{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>GameDay Sports</h1><div class="sub">Account</div><div class="nav"><a href="gameday-wallet.html">Sportsbook</a><a href="gameday-casino-v2.html">Casino</a><a href="gameday-my-bets.html">My Bets</a><a class="active" href="gameday-auth.html">Account</a></div></header>
<main>
<div id="status" class="status">Checking your GameDay account...</div>
<div id="authForms">
<div class="card"><h2>Create Account</h2><label>Email</label><input id="signupEmail" type="email" autocomplete="email"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password"><button id="signupBtn" class="primary">Create GameDay Account</button></div>
<div class="card"><h2>Sign In</h2><label>Email</label><input id="signinEmail" type="email" autocomplete="email"><label>Password</label><input id="signinPassword" type="password" autocomplete="current-password"><button id="signinBtn" class="primary">Sign In</button></div>
</div>
<div id="accountPanel" class="card hidden"><h2>My GameDay Account</h2><div class="email" id="accountEmail">—</div><a class="link" href="gameday-wallet.html">Open Sportsbook</a><a class="link" href="gameday-my-bets.html">View My Bets</a><button id="signoutBtn" class="danger">Sign Out</button></div>
</main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const supabase=createClient("https://qsvrvhcklnsbekxblpfo.supabase.co","sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0");const statusEl=document.getElementById('status'),forms=document.getElementById('authForms'),panel=document.getElementById('accountPanel'),emailEl=document.getElementById('accountEmail');function status(t,c=''){statusEl.textContent=t;statusEl.className='status'+(c?' '+c:'')}function signedOut(){forms.classList.remove('hidden');panel.classList.add('hidden');status('You are not signed in.')}function signedIn(u){forms.classList.add('hidden');panel.classList.remove('hidden');emailEl.textContent=u.email||'GameDay user';status('Your GameDay account is active.','success')}async function check(){const{data,error}=await supabase.auth.getSession();if(error){status(error.message,'error');return}data.session?.user?signedIn(data.session.user):signedOut()}document.getElementById('signupBtn').onclick=async()=>{const email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPassword').value;if(!email||password.length<6){status('Enter a valid email and a password of at least 6 characters.','error');return}status('Creating your GameDay account...');const{data,error}=await supabase.auth.signUp({email,password});if(error){status(error.message,'error');return}data.session?signedIn(data.user):status('Account created. Check your email if confirmation is required.','success')};document.getElementById('signinBtn').onclick=async()=>{const email=document.getElementById('signinEmail').value.trim(),password=document.getElementById('signinPassword').value;if(!email||!password){status('Enter your email and password.','error');return}status('Signing in...');const{data,error}=await supabase.auth.signInWithPassword({email,password});if(error){status(error.message,'error');return}signedIn(data.user)};document.getElementById('signoutBtn').onclick=async()=>{const{error}=await supabase.auth.signOut();error?status(error.message,'error'):signedOut()};supabase.auth.onAuthStateChange((_,s)=>s?.user?signedIn(s.user):signedOut());await check();
</script></body></html>
