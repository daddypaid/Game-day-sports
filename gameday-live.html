<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GameDay Sports</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090e0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #101712;
      border-bottom: 1px solid #27342c;
      padding: 14px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .live-badge {
      background: #163d22;
      color: #aef5bf;
      border: 1px solid #2c7442;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 5px;
      color: #96a49b;
      font-size: 12px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 14px;
    }

    .section-title {
      margin: 8px 0;
      color: #9aa99f;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .featured {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    button,
    select {
      font: inherit;
    }

    .sport-btn,
    .view-btn,
    .market-btn,
    .action-btn {
      cursor: pointer;
      border: 1px solid #324238;
      background: #141c17;
      color: #ffffff;
      font-weight: bold;
    }

    .sport-btn {
      border-radius: 999px;
      padding: 9px 13px;
      white-space: nowrap;
    }

    .sport-btn.active,
    .view-btn.active,
    .market-btn.active {
      background: #eef5f0;
      color: #07100a;
    }

    .worldwide {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: #141c17;
      border: 1px solid #324238;
      color: #ffffff;
    }

    .views {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .view-btn {
      border-radius: 10px;
      padding: 10px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .refresh {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      color: #a6b2aa;
      font-size: 13px;
    }

    .cards {
      display: grid;
      gap: 13px;
    }

    .card {
      background: #131b16;
      border: 1px solid #27372d;
      border-radius: 14px;
      overflow: hidden;
    }

    .card-head {
      padding: 13px;
      border-bottom: 1px solid #27372d;
    }

    .time {
      color: #91a198;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .team {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 6px 0;
      font-size: 16px;
      font-weight: bold;
    }

    .tag {
      color: #829087;
      font-size: 9px;
    }

    .market-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 12px 0;
    }

    .market-btn {
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
      font-size: 11px;
    }

    .books {
      display: grid;
      gap: 9px;
      padding: 11px;
    }

    .book {
      background: #0c130f;
      border: 1px solid #28392f;
      border-radius: 11px;
      padding: 10px;
    }

    .book-name {
      font-size: 12px;
      font-weight: bold;
      color: #d1ddd5;
      margin-bottom: 8px;
    }

    .odds-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .odd {
      background: #172019;
      border: 1px solid #34453a;
      border-radius: 9px;
      padding: 9px;
    }

    .odd-name {
      font-size: 11px;
      color: #b4c0b8;
      overflow-wrap: anywhere;
    }

    .odd-description {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }

    .odd-price {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .odd-point {
      font-size: 11px;
      color: #cbd5ce;
      margin-top: 3px;
    }

    .notice,
    .empty,
    .error {
      background: #141c17;
      border: 1px solid #2b3a31;
      border-radius: 11px;
      padding: 14px;
      color: #b9c4bc;
    }

    .error {
      border-color: #733b3b;
      color: #efb4b4;
    }

    .event-btn,
    .future-btn,
    .prop-btn {
      width: 100%;
      text-align: left;
      background: #141c17;
      border: 1px solid #314137;
      color: white;
      border-radius: 11px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .event-btn strong,
    .future-btn strong {
      display: block;
      margin-bottom: 4px;
    }

    .event-btn span,
    .future-btn span {
      color: #9eada3;
      font-size: 11px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .action-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 13px;
    }

    .back-btn {
      background: #202b24;
      color: #ffffff;
    }

    .group-heading {
      margin: 18px 0 8px;
      color: #a8b6ad;
      font-size: 13px;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      .odds-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <h1>GameDay Sports</h1>
    <div class="live-badge">LIVE ODDS</div>
  </div>

  <div class="subtitle">
    Game Lines • Player Props • Futures • Worldwide Sports
  </div>
</header>

<main>

  <div class="section-title">Featured Sports</div>

  <div class="featured" id="featured">
    <button class="sport-btn active" data-sport="nfl">NFL</button>
    <button class="sport-btn" data-sport="nba">NBA</button>
    <button class="sport-btn" data-sport="wnba">WNBA</button>
    <button class="sport-btn" data-sport="mlb">MLB</button>
    <button class="sport-btn" data-sport="nhl">NHL</button>
    <button class="sport-btn" data-sport="ncaaf">NCAAF</button>
    <button class="sport-btn" data-sport="ncaab">NCAAB</button>
    <button class="sport-btn" data-sport="mls">MLS</button>
    <button class="sport-btn" data-sport="epl">EPL</button>
    <button class="sport-btn" data-sport="ucl">UCL</button>
  </div>

  <div class="section-title">Worldwide Sports</div>

  <select id="sportSelect" class="worldwide">
    <option value="">Loading sports...</option>
  </select>

  <div class="views">
    <button class="view-btn active" data-view="games">Games</button>
    <button class="view-btn" data-view="props">Player Props</button>
    <button class="view-btn" data-view="futures">Futures</button>
  </div>

  <div class="toolbar">
    <button id="refreshBtn" class="refresh">Refresh</button>
    <span id="status">Ready</span>
  </div>

  <div id="content" class="cards"></div>

</main>

<script>
const API =
  "https://qsvrvhcklnsbekxblpfo.supabase.co/functions/v1/odds-proxy";

let currentSport = "nfl";
let currentView = "games";
let gameMarket = "h2h";

let latestGames = [];
let selectedEvent = null;
let propMarkets = [];

const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const sportSelect = document.getElementById("sportSelect");
const refreshBtn = document.getElementById("refreshBtn");

async function api(body) {
  const response = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.detail ||
      data.error ||
      "GameDay request failed"
    );
  }

  return data;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function formatPrice(value) {
  if (typeof value !== "number") {
    return "--";
  }

  return value > 0 ? "+" + value : String(value);
}

function dateTime(value) {
  if (!value) {
    return "Time unavailable";
  }

  return new Intl.DateTimeFormat("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  }).format(new Date(value));
}

function market(book, key) {
  return book?.markets?.find(
    item => item.key === key
  );
}

function marketTitle(key) {
  if (key === "h2h") return "Moneyline";
  if (key === "spreads") return "Spread";
  if (key === "totals") return "Total";

  return key
    .replaceAll("_", " ")
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

function renderBook(book, key) {
  const selectedMarket = market(book, key);

  if (!selectedMarket?.outcomes?.length) {
    return "";
  }

  return `
    <div class="book">

      <div class="book-name">
        GameDay Sports
      </div>

      <div class="odds-grid">

        ${selectedMarket.outcomes.map(outcome => `
          <div class="odd">

            <div class="odd-name">
              ${escapeHtml(outcome.name)}
            </div>

            ${
              outcome.description
                ? `
                  <div class="odd-description">
                    ${escapeHtml(outcome.description)}
                  </div>
                `
                : ""
            }

            <div class="odd-price">
              ${formatPrice(outcome.price)}
            </div>

            ${
              outcome.point !== null &&
              outcome.point !== undefined
                ? `
                  <div class="odd-point">
                    ${escapeHtml(outcome.point)}
                  </div>
                `
                : ""
            }

          </div>
        `).join("")}

      </div>
    </div>
  `;
}

function renderGame(game) {
  return `
    <div class="card">

      <div class="card-head">

        <div class="time">
          ${dateTime(game.commence_time)}
        </div>

        <div class="team">
          <span>${escapeHtml(game.away_team)}</span>
          <span class="tag">AWAY</span>
        </div>

        <div class="team">
          <span>${escapeHtml(game.home_team)}</span>
          <span class="tag">HOME</span>
        </div>

      </div>

      <div class="market-tabs">

        <button
          class="market-btn ${gameMarket === "h2h" ? "active" : ""}"
          onclick="changeGameMarket('h2h')">
          Moneyline
        </button>

        <button
          class="market-btn ${gameMarket === "spreads" ? "active" : ""}"
          onclick="changeGameMarket('spreads')">
          Spread
        </button>

        <button
          class="market-btn ${gameMarket === "totals" ? "active" : ""}"
          onclick="changeGameMarket('totals')">
          Total
        </button>

      </div>

      <div class="books">

        ${
          (game.bookmakers || [])
            .map(book => renderBook(book, gameMarket))
            .filter(Boolean)
            .join("")
        }

      </div>

    </div>
  `;
}

function renderGames() {
  if (!latestGames.length) {
    contentEl.innerHTML = `
      <div class="empty">
        No games are currently available.
      </div>
    `;
    return;
  }

  contentEl.innerHTML =
    latestGames.map(renderGame).join("");
}

function changeGameMarket(key) {
  gameMarket = key;
  renderGames();
}

async function loadGames() {
  statusEl.textContent =
    "Loading GameDay lines...";

  contentEl.innerHTML = "";

  try {
    const data = await api({
      mode: "games",
      sport: currentSport
    });

    latestGames = data.games || [];

    statusEl.textContent =
      latestGames.length + " games";

    renderGames();

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function loadEvents() {
  selectedEvent = null;
  propMarkets = [];

  statusEl.textContent =
    "Loading games for player props...";

  contentEl.innerHTML = "";

  try {
    const data = await api({
      mode: "events",
      sport: currentSport
    });

    const events = data.events || [];

    if (!events.length) {
      statusEl.textContent =
        "No current prop events";

      contentEl.innerHTML = `
        <div class="empty">
          No current events are available for player props.
        </div>
      `;
      return;
    }

    statusEl.textContent =
      "Choose a matchup";

    contentEl.innerHTML =
      `
        <div class="notice">
          Select a game to load the available player-prop markets.
        </div>
      `
      +
      events.map(event => `
        <button
          class="event-btn"
          onclick='selectEvent(${JSON.stringify(event)})'>

          <strong>
            ${escapeHtml(event.away_team)}
            @
            ${escapeHtml(event.home_team)}
          </strong>

          <span>
            ${dateTime(event.commence_time)}
          </span>

        </button>
      `).join("");

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function selectEvent(event) {
  selectedEvent = event;

  statusEl.textContent =
    "Finding available props...";

  contentEl.innerHTML = `
    <div class="notice">
      Checking available player-prop markets...
    </div>
  `;

  try {
    const data = await api({
      mode: "prop_markets",
      sport: currentSport,
      event_id: event.id
    });

    propMarkets =
      data.prop_markets || [];

    if (!propMarkets.length) {
      statusEl.textContent =
        "No props available";

      contentEl.innerHTML = `
        <div class="action-row">
          <button
            class="action-btn back-btn"
            onclick="loadEvents()">
            ← Back
          </button>
        </div>

        <div class="empty">
          No player props are currently available for this game.
        </div>
      `;

      return;
    }

    renderPropPicker();

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

function renderPropPicker() {
  statusEl.textContent =
    propMarkets.length +
    " prop markets";

  contentEl.innerHTML = `
    <div class="card">

      <div class="card-head">

        <div class="time">
          ${dateTime(selectedEvent.commence_time)}
        </div>

        <div class="team">
          ${escapeHtml(selectedEvent.away_team)}
        </div>

        <div class="team">
          ${escapeHtml(selectedEvent.home_team)}
        </div>

      </div>

      <div class="books">

        <div class="action-row">

          <button
            class="action-btn back-btn"
            onclick="loadEvents()">
            ← Games
          </button>

          <button
            class="action-btn"
            onclick="loadAllProps()">
            Load All Props
          </button>

        </div>

        ${
          propMarkets.map(key => `
            <button
              class="prop-btn"
              onclick="loadProp('${key}')">
              ${escapeHtml(marketTitle(key))}
            </button>
          `).join("")
        }

      </div>

    </div>
  `;
}

async function loadProp(key) {
  statusEl.textContent =
    "Loading " +
    marketTitle(key) +
    "...";

  try {
    const data = await api({
      mode: "props",
      sport: currentSport,
      event_id: selectedEvent.id,
      markets: [key]
    });

    renderPropResults(
      data.event,
      [key]
    );

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function loadAllProps() {
  if (!propMarkets.length) return;

  statusEl.textContent =
    "Loading all props...";

  const batches = [];

  for (
    let i = 0;
    i < propMarkets.length;
    i += 8
  ) {
    batches.push(
      propMarkets.slice(i, i + 8)
    );
  }

  let mergedEvent = null;

  try {
    for (
      let i = 0;
      i < batches.length;
      i++
    ) {
      statusEl.textContent =
        `Loading prop group ${i + 1} of ${batches.length}...`;

      const data = await api({
        mode: "props",
        sport: currentSport,
        event_id: selectedEvent.id,
        markets: batches[i]
      });

      const event = data.event;

      if (!mergedEvent) {
        mergedEvent = {
          ...event,
          bookmakers: []
        };
      }

      (event.bookmakers || []).forEach(book => {
        let target =
          mergedEvent.bookmakers.find(
            item => item.key === book.key
          );

        if (!target) {
          target = {
            ...book,
            markets: []
          };

          mergedEvent.bookmakers.push(target);
        }

        target.markets.push(
          ...(book.markets || [])
        );
      });
    }

    renderPropResults(
      mergedEvent,
      propMarkets
    );

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

function renderPropResults(event, keys) {
  statusEl.textContent =
    "GameDay player props";

  const sections =
    keys.map(key => {
      const books =
        (event.bookmakers || [])
          .map(book => {
            const selectedMarket =
              market(book, key);

            if (
              !selectedMarket?.outcomes?.length
            ) {
              return "";
            }

            return `
              <div class="book">

                <div class="book-name">
                  GameDay Sports
                </div>

                <div class="odds-grid">

                  ${
                    selectedMarket.outcomes.map(outcome => `
                      <div class="odd">

                        ${
                          outcome.description
                            ? `
                              <div class="odd-description">
                                ${escapeHtml(outcome.description)}
                              </div>
                            `
                            : ""
                        }

                        <div class="odd-name">
                          ${escapeHtml(outcome.name)}
                        </div>

                        <div class="odd-price">
                          ${formatPrice(outcome.price)}
                        </div>

                        ${
                          outcome.point !== null &&
                          outcome.point !== undefined
                            ? `
                              <div class="odd-point">
                                ${escapeHtml(outcome.point)}
                              </div>
                            `
                            : ""
                        }

                      </div>
                    `).join("")
                  }

                </div>

              </div>
            `;
          })
          .filter(Boolean)
          .join("");

      if (!books) return "";

      return `
        <div class="group-heading">
          ${escapeHtml(marketTitle(key))}
        </div>

        ${books}
      `;
    })
    .filter(Boolean)
    .join("");

  contentEl.innerHTML = `
    <div class="action-row">

      <button
        class="action-btn back-btn"
        onclick="renderPropPicker()">
        ← Prop Markets
      </button>

      <button
        class="action-btn back-btn"
        onclick="loadEvents()">
        Change Game
      </button>

    </div>

    ${
      sections ||
      `
        <div class="empty">
          No prop lines were returned.
        </div>
      `
    }
  `;
}

async function loadFutureMarkets() {
  statusEl.textContent =
    "Finding futures...";

  contentEl.innerHTML = "";

  try {
    const data = await api({
      mode: "future_markets",
      sport: currentSport
    });

    const futures =
      data.futures || [];

    if (!futures.length) {
      statusEl.textContent =
        "No futures available";

      contentEl.innerHTML = `
        <div class="empty">
          No futures are currently available for this sport.
        </div>
      `;

      return;
    }

    statusEl.textContent =
      futures.length +
      " futures markets";

    contentEl.innerHTML =
      `
        <div class="notice">
          Select a futures market.
        </div>
      `
      +
      futures.map(future => `
        <button
          class="future-btn"
          onclick="loadFuture('${future.key}')">

          <strong>
            ${escapeHtml(future.title)}
          </strong>

          <span>
            ${
              escapeHtml(
                future.description ||
                "View GameDay futures"
              )
            }
          </span>

        </button>
      `).join("");

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function loadFuture(key) {
  statusEl.textContent =
    "Loading futures...";

  contentEl.innerHTML = "";

  try {
    const data = await api({
      mode: "futures",
      sport: currentSport,
      future_key: key
    });

    const items =
      data.futures || [];

    let html = `
      <div class="action-row">

        <button
          class="action-btn back-btn"
          onclick="loadFutureMarkets()">
          ← Futures
        </button>

      </div>

      <div class="group-heading">
        ${escapeHtml(data.future?.title || "Futures")}
      </div>
    `;

    items.forEach(item => {
      (item.bookmakers || []).forEach(book => {
        const outright =
          market(book, "outrights");

        if (!outright?.outcomes?.length) {
          return;
        }

        html += `
          <div class="book">

            <div class="book-name">
              GameDay Sports
            </div>

            <div class="odds-grid">

              ${
                outright.outcomes.map(outcome => `
                  <div class="odd">

                    <div class="odd-name">
                      ${escapeHtml(outcome.name)}
                    </div>

                    <div class="odd-price">
                      ${formatPrice(outcome.price)}
                    </div>

                  </div>
                `).join("")
              }

            </div>

          </div>
        `;
      });
    });

    contentEl.innerHTML =
      html ||
      `
        <div class="empty">
          No futures lines returned.
        </div>
      `;

    statusEl.textContent =
      "GameDay futures";

  } catch (error) {
    statusEl.textContent = "Failed";

    contentEl.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function loadSports() {
  try {
    const data = await api({
      mode: "sports"
    });

    const sports =
      data.sports || [];

    sportSelect.innerHTML =
      `
        <option value="">
          Select worldwide sport
        </option>
      `
      +
      sports
        .filter(sport => sport.active)
        .map(sport => `
          <option value="${escapeHtml(sport.key)}">
            ${escapeHtml(sport.group)} — ${escapeHtml(sport.title)}
          </option>
        `)
        .join("");

  } catch (error) {
    sportSelect.innerHTML =
      `
        <option value="">
          Worldwide sports unavailable
        </option>
      `;
  }
}

function setSport(sport) {
  currentSport = sport;

  document
    .querySelectorAll(".sport-btn")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.sport === sport
      );
    });

  loadCurrentView();
}

function setView(view) {
  currentView = view;

  document
    .querySelectorAll(".view-btn")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.view === view
      );
    });

  loadCurrentView();
}

function loadCurrentView() {
  if (currentView === "games") {
    loadGames();
    return;
  }

  if (currentView === "props") {
    loadEvents();
    return;
  }

  if (currentView === "futures") {
    loadFutureMarkets();
  }
}

document
  .querySelectorAll(".sport-btn")
  .forEach(button => {
    button.addEventListener(
      "click",
      () => {
        setSport(
          button.dataset.sport
        );
      }
    );
  });

document
  .querySelectorAll(".view-btn")
  .forEach(button => {
    button.addEventListener(
      "click",
      () => {
        setView(
          button.dataset.view
        );
      }
    );
  });

sportSelect.addEventListener(
  "change",
  () => {
    if (!sportSelect.value) {
      return;
    }

    currentSport =
      sportSelect.value;

    document
      .querySelectorAll(".sport-btn")
      .forEach(button => {
        button.classList.remove(
          "active"
        );
      });

    loadCurrentView();
  }
);

refreshBtn.addEventListener(
  "click",
  loadCurrentView
);

loadSports();
loadGames();
</script>

</body>
</html>
