<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GameDay Roulette</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080d09;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#101712;
  border-bottom:1px solid #27342c;
  padding:14px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:23px;
}

.badge{
  background:#433514;
  color:#f0d987;
  border:1px solid #725c21;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:bold;
}

.account-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

.account{
  color:#aab7ae;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.balance{
  background:#163d22;
  border:1px solid #2e7040;
  color:#c6f1cf;
  border-radius:9px;
  padding:7px 9px;
  font-weight:bold;
  white-space:nowrap;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.nav a{
  color:#fff;
  background:#202b24;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
}

.notice,
.error,
.success{
  border-radius:11px;
  padding:12px;
  margin-bottom:12px;
}

.notice{
  background:#433514;
  border:1px solid #725c21;
  color:#f0d987;
}

.error{
  background:#2a1717;
  border:1px solid #733b3b;
  color:#efb4b4;
}

.success{
  background:#14291a;
  border:1px solid #326744;
  color:#bef1c9;
}

.wheel{
  background:
    radial-gradient(circle,#174c2c 0%,#113820 55%,#0b2817 100%);
  border:2px solid #346e45;
  border-radius:50%;
  width:210px;
  height:210px;
  margin:15px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 25px rgba(0,0,0,.4);
}

.wheel-result{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#111;
  border:4px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.wheel-result.red{
  background:#a51d28;
}

.wheel-result.black{
  background:#111;
}

.wheel-result.green{
  background:#177a36;
}

.result-text{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.control-card{
  background:#111914;
  border:1px solid #2d3d33;
  border-radius:14px;
  padding:14px;
}

label{
  display:block;
  color:#9eaaa1;
  font-size:12px;
  margin-bottom:6px;
}

input{
  width:100%;
  background:#090f0b;
  color:#fff;
  border:1px solid #34493b;
  border-radius:10px;
  padding:13px;
  font-size:18px;
}

.chips{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:9px 0 14px;
}

button{
  min-height:44px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.chips button{
  background:#202b24;
  color:#fff;
}

.bet-title{
  color:#95a298;
  font-size:12px;
  text-transform:uppercase;
  font-weight:bold;
  margin:13px 0 8px;
}

.outside{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}

.bet-button{
  background:#26312a;
  color:#fff;
  border:1px solid #3e4c43;
}

.bet-button.selected{
  outline:3px solid #d7c56f;
}

.red-bet{
  background:#8c2029;
}

.black-bet{
  background:#111;
}

.number-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
}

.number{
  color:#fff;
  min-height:42px;
  font-size:14px;
}

.number.red{
  background:#8f202a;
}

.number.black{
  background:#171717;
}

.number.green{
  background:#17743a;
}

.spin{
  width:100%;
  margin-top:14px;
  background:#eef5f0;
  color:#07100a;
  font-size:17px;
}

.spin:disabled{
  opacity:.45;
}

.history-title{
  margin:18px 0 8px;
  color:#91a097;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

.history{
  background:#111914;
  border:1px solid #2d3d33;
  border-radius:11px;
  padding:11px;
  margin-bottom:8px;
}

.history-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.small{
  color:#8f9d94;
  font-size:11px;
  margin-top:5px;
}

@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}.nav a{font-size:12px;padding:10px 6px}}
</style>
</head>

<body>

<header>

<div class="header-row">
<h1>GameDay Roulette</h1>
<div class="badge">TEST CASINO</div>
</div>

<div class="account-row">
<div id="account" class="account">Checking account...</div>
<div id="balance" class="balance">Balance: —</div>
</div>

</header>

<main>

<div class="nav">
<a href="gameday-sportsbook.html">Sportsbook</a>
<a href="gameday-casino-v2.html">Casino</a>
<a href="gameday-my-bets.html">My Bets</a>
<a href="gameday-auth.html">Account</a>
</div>

<div class="notice">
TEST MODE — Roulette uses your GameDay test wallet only.
</div>

<div id="message"></div>

<div class="wheel">
<div id="wheelResult" class="wheel-result green">?</div>
</div>

<div id="resultText" class="result-text">
Choose a bet
</div>

<div class="control-card">

<label>Stake</label>

<input
id="stake"
type="number"
min="1"
max="10000"
value="25">

<div class="chips">
<button data-chip="10">$10</button>
<button data-chip="25">$25</button>
<button data-chip="50">$50</button>
<button data-chip="100">$100</button>
</div>

<div class="bet-title">Even Money Bets</div>

<div class="outside">

<button class="bet-button red-bet" data-type="red">
Red
</button>

<button class="bet-button black-bet" data-type="black">
Black
</button>

<button class="bet-button" data-type="odd">
Odd
</button>

<button class="bet-button" data-type="even">
Even
</button>

<button class="bet-button" data-type="low">
1–18
</button>

<button class="bet-button" data-type="high">
19–36
</button>

</div>

<div class="bet-title">
Straight Number
</div>

<div id="numbers" class="number-grid"></div>

<button id="spinBtn" class="spin">
Spin Roulette
</button>

</div>

<div class="history-title">
Recent Spins
</div>

<div id="history">
Loading...
</div>

</main>

<script type="module">

import {
createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase =
createClient(
"https://qsvrvhcklnsbekxblpfo.supabase.co",
"sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0"
);

let user = null;
let walletBalance = 0;
let selectedType = null;
let selectedValue = null;

const redNumbers =
new Set([
1,3,5,7,9,12,14,16,18,
19,21,23,25,27,30,32,34,36
]);

const account =
document.getElementById("account");

const balance =
document.getElementById("balance");

const stake =
document.getElementById("stake");

const message =
document.getElementById("message");

const wheelResult =
document.getElementById("wheelResult");

const resultText =
document.getElementById("resultText");

const history =
document.getElementById("history");

const spinBtn =
document.getElementById("spinBtn");

function money(v){
return "$" + Number(v || 0).toFixed(2);
}

function showMessage(text,type="success"){
message.innerHTML =
`<div class="${type}">${text}</div>`;
}

function numberColor(n){

if(n === 0){
return "green";
}

return redNumbers.has(n)
? "red"
: "black";

}

function renderNumbers(){

const box =
document.getElementById("numbers");

let html = "";

for(let n=0;n<=36;n++){

html +=
`<button
class="number ${numberColor(n)}"
data-type="number"
data-value="${n}">
${n}
</button>`;

}

box.innerHTML = html;

}

function clearSelection(){

document
.querySelectorAll("[data-type]")
.forEach(
el =>
el.classList.remove("selected")
);

}

function selectBet(button){

clearSelection();

button.classList.add("selected");

selectedType =
button.dataset.type;

selectedValue =
button.dataset.value ?? null;

resultText.textContent =
selectedType === "number"
? `Bet selected: Number ${selectedValue}`
: `Bet selected: ${selectedType.toUpperCase()}`;

}

async function loadAccount(){

const {
data,
error
} =
await supabase.auth.getSession();

if(error || !data.session){

account.textContent =
"Not signed in";

balance.textContent =
"Balance: —";

showMessage(
"Sign in before playing Roulette.",
"error"
);

return false;

}

user =
data.session.user;

account.textContent =
user.email || "GameDay user";

return true;

}

async function loadWallet(){

if(!user){
return;
}

const {
data,
error
} =
await supabase
.from("wallets")
.select("balance")
.eq("user_id",user.id)
.single();

if(error){
balance.textContent =
"Balance unavailable";
return;
}

walletBalance =
Number(data.balance || 0);

balance.textContent =
"Balance: " +
money(walletBalance);

}

async function spin(){

message.innerHTML = "";

if(!selectedType){

showMessage(
"Choose a Roulette bet first.",
"error"
);

return;
}

const amount =
Number(stake.value);

if(
!Number.isFinite(amount) ||
amount <= 0
){

showMessage(
"Enter a valid stake.",
"error"
);

return;
}

if(amount > walletBalance){

showMessage(
"Insufficient test balance.",
"error"
);

return;
}

spinBtn.disabled = true;
spinBtn.textContent = "Spinning...";

try{

const {
data,
error
} =
await supabase.functions.invoke(
"roulette-test",
{
body:{
stake:amount,
bet_type:selectedType,
bet_value:selectedValue
}
}
);

if(error){
throw error;
}

if(data?.error){
throw new Error(data.error);
}

const spin =
data.spin;

walletBalance =
Number(spin.balance);

balance.textContent =
"Balance: " +
money(walletBalance);

wheelResult.textContent =
spin.winning_number;

wheelResult.className =
"wheel-result " +
spin.winning_color;

if(spin.result === "won"){

resultText.textContent =
`WIN — ${spin.winning_number} ${spin.winning_color.toUpperCase()}`;

showMessage(
`You won ${money(spin.payout)} total return.`
);

}else{

resultText.textContent =
`LOSS — ${spin.winning_number} ${spin.winning_color.toUpperCase()}`;

showMessage(
"Roulette wager lost.",
"error"
);

}

await loadHistory();

}catch(err){

showMessage(
err.message ||
"Unable to spin Roulette.",
"error"
);

}finally{

spinBtn.disabled = false;
spinBtn.textContent =
"Spin Roulette";

}

}

async function loadHistory(){

if(!user){
return;
}

const {
data,
error
} =
await supabase
.from("roulette_spins")
.select(
"stake,bet_type,bet_value,winning_number,winning_color,payout,result,created_at"
)
.order("created_at",{
ascending:false
})
.limit(10);

if(error){

history.innerHTML =
`<div class="error">Unable to load Roulette history.</div>`;

return;
}

if(!data?.length){

history.innerHTML =
`<div class="notice">No Roulette spins yet.</div>`;

return;
}

history.innerHTML =
data.map(spin => `

<div class="history">

<div class="history-row">

<strong>
${spin.result.toUpperCase()}
</strong>

<strong>
${money(spin.stake)}
</strong>

</div>

<div class="history-row">

<span>
Bet:
${spin.bet_type === "number"
? "Number " + spin.bet_value
: spin.bet_type.toUpperCase()}
</span>

<span>
Result:
${spin.winning_number}
</span>

</div>

<div class="small">

${spin.winning_color.toUpperCase()}
•
Payout ${money(spin.payout)}

</div>

</div>

`).join("");

}

document
.querySelectorAll("[data-chip]")
.forEach(button => {

button.addEventListener(
"click",
() => {

stake.value =
button.dataset.chip;

}
);

});

document
.addEventListener(
"click",
event => {

const button =
event.target.closest("[data-type]");

if(button){
selectBet(button);
}

}
);

spinBtn.addEventListener(
"click",
spin
);

renderNumbers();

const signedIn =
await loadAccount();

if(signedIn){

await Promise.all([
loadWallet(),
loadHistory()
]);

}

</script>

</body>
</html>
