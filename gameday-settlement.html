<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GameDay Settlement</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090e0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#101712;
  border-bottom:1px solid #27342c;
  padding:14px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:23px;
}

.badge{
  background:#433514;
  color:#f0d987;
  border:1px solid #725c21;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:bold;
}

.account{
  margin-top:8px;
  color:#aeb9b1;
  font-size:12px;
}

main{
  max-width:700px;
  margin:auto;
  padding:14px;
}

.balance-card{
  background:#132419;
  border:1px solid #2d5d39;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
}

.balance-label{
  color:#aab7ae;
  font-size:12px;
}

.balance{
  font-size:30px;
  font-weight:bold;
  margin-top:4px;
}

.notice,
.error,
.success{
  border-radius:11px;
  padding:13px;
  margin-bottom:12px;
}

.notice{
  background:#433514;
  border:1px solid #725c21;
  color:#f0d987;
}

.error{
  background:#2a1717;
  border:1px solid #733b3b;
  color:#efb4b4;
}

.success{
  background:#14291a;
  border:1px solid #326744;
  color:#bef1c9;
}

.section-title{
  color:#91a097;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  margin:18px 0 8px;
}

.wager{
  background:#131b16;
  border:1px solid #2c3b31;
  border-radius:13px;
  padding:13px;
  margin-bottom:12px;
}

.wager-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.wager-type{
  font-size:18px;
  font-weight:bold;
}

.amount{
  font-size:18px;
  font-weight:bold;
}

.detail{
  margin-top:6px;
  color:#c5d0c8;
}

.small{
  margin-top:7px;
  color:#8f9d94;
  font-size:11px;
}

.status{
  display:inline-block;
  margin-top:8px;
  border-radius:999px;
  padding:5px 8px;
  background:#222d26;
  color:#ced7d1;
  font-size:11px;
  font-weight:bold;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}

button{
  min-height:44px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.win-btn{
  background:#1d5d30;
  color:#fff;
}

.lose-btn{
  background:#5a2222;
  color:#fff;
}

.void-btn{
  background:#56451d;
  color:#fff;
}

button:disabled{
  opacity:.45;
}

.activity{
  background:#131b16;
  border:1px solid #2c3b31;
  border-radius:11px;
  padding:11px;
  margin-bottom:8px;
}

.activity-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.activity-small{
  color:#8f9d94;
  font-size:11px;
  margin-top:6px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:14px;
}

.nav a{
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:10px;
  background:#202b24;
  color:#fff;
  font-weight:bold;
}

.refresh{
  width:100%;
  margin-bottom:12px;
  background:#eef5f0;
  color:#07100a;
  padding:12px;
}
</style>
</head>

<body>

<header>

<div class="header-row">
  <h1>GameDay Sports</h1>
  <div class="badge">TEST SETTLEMENT</div>
</div>

<div id="accountStatus" class="account">
Checking GameDay account...
</div>

</header>

<main>

<div class="nav">

<a href="gameday-wallet.html">
Sportsbook
</a>

<a href="gameday-auth.html">
Account
</a>

</div>

<div class="balance-card">

<div class="balance-label">
Available Test Balance
</div>

<div id="balance" class="balance">
—
</div>

</div>

<div class="notice">
This page settles test wagers only. No real money is involved.
</div>

<div id="message"></div>

<button
  id="refreshBtn"
  class="refresh">
Refresh Wagers
</button>

<div class="section-title">
Pending Test Wagers
</div>

<div id="pendingWagers">
Loading...
</div>

<div class="section-title">
Settled Test Wagers
</div>

<div id="settledWagers">
Loading...
</div>

<div class="section-title">
Wallet Activity
</div>

<div id="walletActivity">
Loading...
</div>

</main>

<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://qsvrvhcklnsbekxblpfo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser =
null;

const accountStatus =
document.getElementById(
  "accountStatus"
);

const balanceEl =
document.getElementById(
  "balance"
);

const messageEl =
document.getElementById(
  "message"
);

const pendingWagers =
document.getElementById(
  "pendingWagers"
);

const settledWagers =
document.getElementById(
  "settledWagers"
);

const walletActivity =
document.getElementById(
  "walletActivity"
);

function escapeHtml(value){

  return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");

}

function money(value){

  return "$" +
  Number(value || 0)
  .toFixed(2);

}

function dateTime(value){

  if(!value){
    return "—";
  }

  return new Intl.DateTimeFormat(
    "en-US",
    {
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  ).format(
    new Date(value)
  );

}

function showMessage(
  text,
  type="success"
){

  messageEl.innerHTML =
  `
  <div class="${type}">
    ${escapeHtml(text)}
  </div>
  `;

}

async function checkAccount(){

  const {
    data,
    error
  } =
  await supabase.auth.getSession();

  if(
    error ||
    !data.session
  ){

    currentUser =
    null;

    accountStatus.textContent =
    "Not signed in";

    showMessage(
      "Sign in to your GameDay account first.",
      "error"
    );

    return false;
  }

  currentUser =
  data.session.user;

  accountStatus.textContent =
  currentUser.email ||
  "GameDay user";

  return true;

}

async function loadWallet(){

  if(!currentUser){
    return;
  }

  const {
    data,
    error
  } =
  await supabase
  .from("wallets")
  .select(
    "balance,currency"
  )
  .eq(
    "user_id",
    currentUser.id
  )
  .single();

  if(error){

    balanceEl.textContent =
    "Unavailable";

    return;
  }

  balanceEl.textContent =
  money(
    data.balance
  );

}

async function loadWagers(){

  if(!currentUser){
    return;
  }

  const {
    data,
    error
  } =
  await supabase
  .from("wagers")
  .select(
    "id,wager_type,stake,potential_return,status,placed_at,settled_at,is_test"
  )
  .eq(
    "is_test",
    true
  )
  .order(
    "placed_at",
    {
      ascending:false
    }
  );

  if(error){

    pendingWagers.innerHTML =
    `
    <div class="error">
      Unable to load wagers.
    </div>
    `;

    return;
  }

  const pending =
  (data || [])
  .filter(
    wager =>
    wager.status ===
    "pending"
  );

  const settled =
  (data || [])
  .filter(
    wager =>
    wager.status !==
    "pending"
  );

  renderPending(
    pending
  );

  renderSettled(
    settled
  );

}

function renderPending(
  wagers
){

  if(
    !wagers.length
  ){

    pendingWagers.innerHTML =
    `
    <div class="notice">
      No pending test wagers.
    </div>
    `;

    return;
  }

  pendingWagers.innerHTML =
  wagers.map(
    wager => `

    <div class="wager">

      <div class="wager-top">

        <div class="wager-type">
          ${escapeHtml(
            wager.wager_type
            .toUpperCase()
          )}
        </div>

        <div class="amount">
          ${money(
            wager.stake
          )}
        </div>

      </div>

      <div class="detail">
        Potential Return:
        <strong>
          ${money(
            wager.potential_return
          )}
        </strong>
      </div>

      <div class="status">
        PENDING
      </div>

      <div class="small">
        ${dateTime(
          wager.placed_at
        )}
      </div>

      <div class="actions">

        <button
          class="win-btn"
          data-id="${escapeHtml(
            wager.id
          )}"
          data-result="won">
          Win
        </button>

        <button
          class="lose-btn"
          data-id="${escapeHtml(
            wager.id
          )}"
          data-result="lost">
          Lose
        </button>

        <button
          class="void-btn"
          data-id="${escapeHtml(
            wager.id
          )}"
          data-result="void">
          Void
        </button>

      </div>

    </div>

    `
  ).join("");

  document
  .querySelectorAll(
    "[data-result]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          settleWager(
            button.dataset.id,
            button.dataset.result,
            button
          );

        }
      );

    }
  );

}

function renderSettled(
  wagers
){

  if(
    !wagers.length
  ){

    settledWagers.innerHTML =
    `
    <div class="notice">
      No settled test wagers yet.
    </div>
    `;

    return;
  }

  settledWagers.innerHTML =
  wagers.map(
    wager => `

    <div class="wager">

      <div class="wager-top">

        <div class="wager-type">
          ${escapeHtml(
            wager.wager_type
            .toUpperCase()
          )}
        </div>

        <div class="amount">
          ${money(
            wager.stake
          )}
        </div>

      </div>

      <div class="detail">
        Potential Return:
        <strong>
          ${money(
            wager.potential_return
          )}
        </strong>
      </div>

      <div class="status">
        ${escapeHtml(
          wager.status
          .toUpperCase()
        )}
      </div>

      <div class="small">

        Placed:
        ${dateTime(
          wager.placed_at
        )}

        <br>

        Settled:
        ${dateTime(
          wager.settled_at
        )}

      </div>

    </div>

    `
  ).join("");

}

async function settleWager(
  wagerId,
  result,
  button
){

  if(
    !currentUser
  ){

    showMessage(
      "You must be signed in.",
      "error"
    );

    return;
  }

  const labels = {
    won:"WIN",
    lost:"LOSS",
    void:"VOID"
  };

  const confirmed =
  confirm(
    `Settle this test wager as ${labels[result]}?`
  );

  if(
    !confirmed
  ){
    return;
  }

  button.disabled =
  true;

  messageEl.innerHTML =
  `
  <div class="notice">
    Settling wager...
  </div>
  `;

  try{

    const {
      data,
      error
    } =
    await supabase.functions.invoke(
      "settle-test-wager",
      {
        body:{
          wager_id:
          wagerId,

          result:
          result
        }
      }
    );

    if(error){
      throw error;
    }

    if(
      data?.error
    ){

      throw new Error(
        data.error
      );

    }

    showMessage(
      `Wager settled as ${labels[result]}.`
    );

    await Promise.all([
      loadWallet(),
      loadWagers(),
      loadWalletActivity()
    ]);

  }catch(error){

    showMessage(
      error.message ||
      "Unable to settle wager.",
      "error"
    );

  }finally{

    button.disabled =
    false;

  }

}

async function loadWalletActivity(){

  if(!currentUser){
    return;
  }

  const {
    data,
    error
  } =
  await supabase
  .from(
    "wallet_transactions"
  )
  .select(
    "id,transaction_type,amount,balance_after,note,created_at"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  )
  .limit(20);

  if(error){

    walletActivity.innerHTML =
    `
    <div class="error">
      Unable to load wallet activity.
    </div>
    `;

    return;
  }

  if(
    !data?.length
  ){

    walletActivity.innerHTML =
    `
    <div class="notice">
      No wallet activity.
    </div>
    `;

    return;
  }

  walletActivity.innerHTML =
  data.map(
    item => `

    <div class="activity">

      <div class="activity-row">

        <strong>
          ${escapeHtml(
            String(
              item.transaction_type
            )
            .replaceAll(
              "_",
              " "
            )
            .toUpperCase()
          )}
        </strong>

        <strong>
          ${money(
            item.amount
          )}
        </strong>

      </div>

      <div class="activity-row">

        <span>
          Balance after
        </span>

        <span>
          ${money(
            item.balance_after
          )}
        </span>

      </div>

      <div class="activity-small">

        ${escapeHtml(
          item.note ||
          ""
        )}

        <br>

        ${dateTime(
          item.created_at
        )}

      </div>

    </div>

    `
  ).join("");

}

async function refreshAll(){

  messageEl.innerHTML =
  "";

  const signedIn =
  await checkAccount();

  if(
    !signedIn
  ){
    return;
  }

  await Promise.all([
    loadWallet(),
    loadWagers(),
    loadWalletActivity()
  ]);

}

document
.getElementById(
  "refreshBtn"
)
.addEventListener(
  "click",
  refreshAll
);

supabase.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(
      session?.user
    ){

      currentUser =
      session.user;

      accountStatus.textContent =
      currentUser.email ||
      "GameDay user";

      await Promise.all([
        loadWallet(),
        loadWagers(),
        loadWalletActivity()
      ]);

    }else{

      currentUser =
      null;

      accountStatus.textContent =
      "Not signed in";

      balanceEl.textContent =
      "—";

    }

  }
);

await refreshAll();

</script>

</body>
</html>
