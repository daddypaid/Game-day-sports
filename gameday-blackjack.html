<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#101712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameDay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/gameday-192.png">
<title>GameDay Blackjack</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07100a;color:#fff;font-family:Arial,sans-serif}
body{padding-bottom:90px}
header{background:#101712;border-bottom:1px solid #27342c;padding:14px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:23px}
.badge{background:#433514;color:#f0d987;border:1px solid #725c21;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:bold}
main{max-width:760px;margin:auto;padding:14px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nav a{text-decoration:none;text-align:center;padding:11px;border-radius:10px;background:#202b24;color:#fff;font-weight:bold}
.game-stage{margin-top:14px;background:#000}
.game-stage img{display:block;width:100%;height:auto;object-fit:contain}
html body.blackjack-artwork-page,html[data-gameday-page="casino-game"] body.blackjack-artwork-page{height:auto!important;overflow:visible!important;background:#07100a!important;padding-bottom:calc(92px + env(safe-area-inset-bottom))!important}
html body.blackjack-artwork-page main{height:auto!important;overflow:visible!important}
@media(max-width:520px){header{padding:10px}h1{font-size:20px}.nav{grid-template-columns:repeat(2,1fr)}.nav a{font-size:12px;padding:10px 6px}}
</style>
<link rel="stylesheet" href="gameday-table-wager.css">
<link rel="stylesheet" href="gameday-standard-deck.css">
<link rel="stylesheet" href="gameday-table-dealing.css">
<link rel="stylesheet" href="gameday-blackjack-game.css">
<link rel="stylesheet" href="gameday-table-fullscreen.css">
</head>
<body class="blackjack-artwork-page gd-table-fullscreen">

<main>
  <section class="game-stage" aria-label="Blackjack game area"><img data-table-trim-top="10" src="assets/card-tables/gameday-blackjack-table.png" width="702" height="1280" alt="GameDay Blackjack table artwork" fetchpriority="high"></section>
<footer class="gd-table-footer" aria-label="Game account and navigation">
  <div class="nav">
    <a href="gameday-sportsbook.html">Sportsbook</a>
    <a href="gameday-casino-v2.html">Casino</a>
    <a href="gameday-my-bets.html">My Bets</a>
    <a href="gameday-auth.html">Account</a>
  </div>
</footer>
</main>
<script src="gameday-app.js" defer></script>
<script src="gameday-table-wager.js" defer></script>
<script src="gameday-table-dealing.js" defer></script>
<script type="module" src="gameday-blackjack-game.js"></script>
</body>
</html>
