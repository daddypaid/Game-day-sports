<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDay Sports</title>

  <style>
    body {
      margin: 0;
      background: #0b0f0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px;
      background: #111814;
      border-bottom: 1px solid #26332b;
    }

    h1 {
      margin: 0;
    }

    main {
      padding: 22px;
    }

    .status {
      padding: 16px;
      margin-top: 20px;
      background: #151d18;
      border-radius: 12px;
    }

    button {
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<header>
  <h1>GameDay Sports</h1>
</header>

<main>
  <h2>Live Sportsbook Connection Test</h2>

  <p>
    This page tests the new GameDay frontend connection
    to the Supabase live-odds backend.
  </p>

  <button onclick="loadOdds()">Load Live NFL Odds</button>

  <div class="status">
    <strong>Status:</strong>
    <span id="status">Ready</span>
  </div>

  <pre id="results"></pre>
</main>

<script>
  const ODDS_PROXY =
    "https://qsvrvhcklnsbekxblpfo.supabase.co/functions/v1/odds-proxy";

  async function loadOdds() {
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    status.textContent = "Loading live odds...";
    results.textContent = "";

    try {
      const response = await fetch(ODDS_PROXY, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          sport: "nfl"
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Backend returned HTTP " + response.status
        );
      }

      status.textContent = "Connected to live odds backend";
      results.textContent = JSON.stringify(data, null, 2);

    } catch (error) {
      status.textContent = "Connection failed";
      results.textContent = error.message;
    }
  }
</script>

</body>
</html>
