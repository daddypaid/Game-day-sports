1px dashed rgba(255,255,255,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-size:11px}.divider{height:1px;background:rgba(255,255,255,.13);margin:5px 8px}.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:5px 0}.betbox{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.16);border-radius:8px;padding:5px;text-align:center}.betbox span{display:block;font-size:8px;color:#c8d4cb}.betbox strong{font-size:11px;color:#f1dd96}.result{text-align:center;min-height:17px;font-size:11px;font-weight:900;color:#f1df9b;margin-top:3px}.controls{background:#0e1812;border:1px solid #2d4637;border-radius:10px;padding:6px;margin-top:5px}.stake{display:grid;grid-template-columns:70px 1fr;gap:4px}.stake input{width:100%;height:34px;background:#080e0a;color:#fff;border:1px solid #385541;border-radius:7px;padding:5px;font-size:15px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.chips button,.actions button{border:0;border-radius:7px;min-height:34px;font-weight:900}.chips button{background:#213228;color:#fff;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.actions button{font-size:11px}.primary{background:#f1e4b1;color:#142016}.secondary{background:#26372d;color:#fff}.fold{background:#70272b;color:#fff}.actions button:disabled{opacity:.35}.backlink{display:inline-block;color:#b8c7bd;text-decoration:none;font-size:9px;font-weight:800;margin-top:5px}

@media(max-width:430px){body{padding-bottom:70px}header{position:relative;padding:6px 8px}.top h1{font-size:17px}.sub{font-size:8px}.wallet{padding:4px 6px}.wallet strong{font-size:11px}main{padding:4px}.status{padding:4px 6px;margin-bottom:3px;font-size:8px}.table{padding:5px;border-width:2px;border-radius:18px}.logo{font-size:8px}.area{margin-top:3px}.label{font-size:7px;margin-bottom:2px}.cards{min-height:53px;gap:3px}.card,.slot{width:38px;height:52px}.community{grid-template-columns:repeat(5,38px);gap:3px;min-height:52px}.rank{font-size:8px}.suit{font-size:15px}.divider{margin:3px 6px}.bets{margin:3px 0;gap:3px}.betbox{padding:3px}.betbox span{font-size:7px}.betbox strong{font-size:9px}.result{font-size:9px;min-height:12px;margin-top:2px}.controls{margin-top:3px;padding:4px}.stake{grid-template-columns:58px 1fr;gap:3px}.stake input{height:30px;font-size:13px}.chips{gap:2px}.chips button,.actions button{min-height:30px;font-size:8px}.actions{margin-top:3px;gap:3px}.backlink{margin-top:3px;font-size:8px}}

<header><div class="top"><div><h1>Ultimate Texas Hold'em</h1><div class="sub">GameDay Casino Poker • TEST MODE</div></div><div class="wallet"><span>TEST WALLET</span><strong id="wallet">—</strong></div></div></header>
<main><div id="status" class="status">Checking account…</div><div class="table"><div class="logo">♠ GAMEDAY ULTIMATE HOLD'EM ♦</div>
<div class="area"><div class="label">DEALER</div><div id="dealerCards" class="cards"><div class="card back"></div><div class="card back"></div></div></div><div class="divider"></div>
<div class="area"><div class="label">COMMUNITY</div><div id="community" class="community"></div></div><div class="divider"></div>
<div class="area"><div class="label">YOUR HAND</div><div id="playerCards" class="cards"></div></div>
<div class="bets"><div class="betbox"><span>ANTE</span><strong id="anteView">—</strong></div><div class="betbox"><span>BLIND</span><strong id="blindView">—</strong></div><div class="betbox"><span>PLAY</span><strong id="playView">—</strong></div></div><div id="result" class="result">Ready to Deal</div></div>
<div class="controls"><div class="stake"><input id="ante" type="number" min="1" max="1000" value="25"><div class="chips"><button data-chip="10">10</button><button data-chip="25">25</button><button data-chip="50">50</button><button data-chip="100">100</button></div></div><div id="actions" class="actions"><button id="deal" class="primary">DEAL</button><button disabled>—</button></div></div><a class="backlink" href="gameday-poker.html">‹ Back to GameDay Poker</a></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const supabase=createClient("https://qsvrvhcklnsbekxblpfo.supabase.co","sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0");let user=null,round=null,balance=0;const $=id=>document.getElementById(id),wallet=$('wallet'),status=$('status'),player=$('playerCards'),dealer=$('dealerCards'),community=$('community'),ante=$('ante'),actions=$('actions'),result=$('result'),anteView=$('anteView'),blindView=$('blindView'),playView=$('playView');
function money(v){return '$'+Number(v||0).toFixed(2)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function card(c){if(!c)return '<div class="slot">?</div>';const red=c.suit==='♥'||c.suit==='♦';return `<div class="card ${red?'red':''}"><div class="rank">${esc(c.rank)}</div><div class="suit">${esc(c.suit)}</div><div class="rank">${esc(c.rank)}</div></div>`}function setStatus(t,type=''){status.className='status'+(type?' '+type:'');status.textContent=t}function hiddenDealer(){dealer.innerHTML='<div class="card back"></div><div class="card back"></div>'}function renderCommunity(cs=[]){community.innerHTML=Array.from({length:5},(_,i)=>cs[i]?card(cs[i]):'<div class="slot">'+(i+1)+'</div>').join('')}function setBets(r){anteView.textContent=r?money(r.ante):'—';blindView.textContent=r?money(r.ante):'—';playView.textContent=r&&Number(r.play_bet)>0?money(r.play_bet):'—'}
async function api(body){const{data,error}=await supabase.functions.invoke('ultimate-texas-holdem-test',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}async function walletLoad(){if(!user)return;const{data,error}=await supabase.from('wallets').select('balance').eq('user_id',user.id).single();if(!error){balance=Number(data.balance||0);wallet.textContent=money(balance)}}
function actionButton(label,cls,fn){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function renderActions(){actions.innerHTML='';if(!round){actions.append(actionButton('DEAL','primary',dealRound));const b=actionButton('—','secondary',()=>{});b.disabled=true;actions.append(b);ante.disabled=false;return}ante.disabled=true;if(round.stage==='preflop'){actions.append(actionButton('PLAY 4×','primary',()=>act('bet4')));actions.append(actionButton('CHECK','secondary',()=>act('check')))}else if(round.stage==='flop'){actions.append(actionButton('PLAY 2×','primary',()=>act('bet2')));actions.append(actionButton('CHECK','secondary',()=>act('check')))}else if(round.stage==='river'){actions.append(actionButton('PLAY 1×','primary',()=>act('bet1')));actions.append(actionButton('FOLD','fold',()=>act('fold')))}}function renderActive(r){round=r;player.innerHTML=(r.player_hand||[]).map(card).join('');hiddenDealer();renderCommunity(r.community||[]);setBets(r);result.textContent=r.stage==='preflop'?'Play 4× or Check':r.stage==='flop'?'Play 2× or Check':'Play 1× or Fold';renderActions()}
function renderSettled(r){round=null;player.innerHTML=(r.player_hand||[]).map(card).join('');dealer.innerHTML=(r.dealer_hand||[]).map(card).join('');renderCommunity(r.community||[]);playView.textContent=r.play_bet?money(r.play_bet):playView.textContent;result.textContent=`${r.result} • You: ${r.player_rank} • Dealer: ${r.dealer_rank} • Return ${money(r.payout)}`;ante.disabled=false;renderActions();setStatus(r.payout>0?'Round settled':'Round complete',r.payout>0?'win':'')}
async function dealRound(){const a=Number(ante.value);if(!Number.isFinite(a)||a<=0){setStatus('Enter a valid Ante','error');return}actions.querySelectorAll('button').forEach(b=>b.disabled=true);setStatus('Dealing…');try{const d=await api({action:'deal',ante:a});balance=Number(d.balance);wallet.textContent=money(balance);renderActive(d.round);setStatus('Ante + Blind placed • choose 4× or Check')}catch(e){setStatus(e.message||'Unable to deal','error');round=null;renderActions()}}
async function act(action){actions.querySelectorAll('button').forEach(b=>b.disabled=true);setStatus('Processing…');try{const d=await api({action,round_id:round.id});balance=Number(d.balance);wallet.textContent=money(balance);if(d.round.status==='settled')renderSettled(d.round);else{renderActive(d.round);setStatus(d.round.stage==='flop'?'Flop revealed':'All community cards revealed')}}catch(e){setStatus(e.message||'Action failed','error');renderActions()}}
async function resume(){try{const d=await api({action:'resume'});if(d.round){renderActive(d.round);setStatus('Active Ultimate Hold’em round restored')}else{round=null;player.innerHTML='<div class="slot">?</div><div class="slot">?</div>';hiddenDealer();renderCommunity([]);setBets(null);result.textContent='Ready to Deal';renderActions();setStatus('Signed in • ready to play')}}catch(e){setStatus(e.message||'Unable to resume','error')}}document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{if(!ante.disabled)ante.value=b.dataset.chip});const{data,error}=await supabase.auth.getSession();if(error||!data.session){setStatus('Sign in to your GameDay account before playing','error');wallet.textContent='Sign in';round=null;renderActions();actions.querySelectorAll('button').forEach(b=>b.disabled=true);player.innerHTML='<div class="slot">?</div><div class="slot">?</div>';hiddenDealer();renderCommunity([])}else{user=data.session.user;await walletLoad();await resume()}
supabase.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(!user){wallet.textContent='Sign in';setStatus('Sign in to play','error')}else{await walletLoad();await resume()}});
</script><script src="gameday-card-wager-ui.js" defer></script>
