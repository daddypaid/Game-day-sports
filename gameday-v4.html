<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameDay Sports V4</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0a0f0c;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#101712;
  border-bottom:1px solid #27342c;
  padding:15px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:23px;
}

.live{
  background:#183923;
  color:#aaf0bd;
  border:1px solid #307344;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:bold;
}

.subtitle{
  color:#91a299;
  font-size:12px;
  margin-top:5px;
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.section-title{
  font-size:12px;
  color:#91a299;
  font-weight:bold;
  margin:5px 0 8px;
  text-transform:uppercase;
}

.featured{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:10px;
}

.sport-btn,
.view-btn,
.market-btn{
  border:1px solid #314137;
  background:#141c17;
  color:white;
  border-radius:999px;
  padding:9px 13px;
  white-space:nowrap;
  font-weight:bold;
  cursor:pointer;
}

.sport-btn.active,
.view-btn.active,
.market-btn.active{
  background:#f1f7f3;
  color:#07100a;
}

.worldwide{
  width:100%;
  padding:12px;
  background:#141c17;
  color:white;
  border:1px solid #314137;
  border-radius:10px;
  font-size:14px;
  margin-bottom:13px;
}

.views{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:13px;
}

.view-btn{
  border-radius:10px;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:13px;
}

.refresh{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

#status{
  color:#a6b3aa;
  font-size:13px;
}

.cards{
  display:grid;
  gap:13px;
}

.card{
  background:#131b16;
  border:1px solid #27372d;
  border-radius:14px;
  overflow:hidden;
}

.card-head{
  padding:13px;
  border-bottom:1px solid #27372d;
}

.time{
  color:#91a198;
  font-size:11px;
  margin-bottom:8px;
}

.team{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:16px;
  font-weight:bold;
  margin:6px 0;
}

.tag{
  color:#84958a;
  font-size:9px;
}

.market-tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:10px 12px 0;
}

.market-btn{
  padding:7px 10px;
  font-size:11px;
}

.books{
  display:grid;
  gap:9px;
  padding:11px;
}

.book{
  background:#0c130f;
  border:1px solid #28392f;
  border-radius:11px;
  padding:10px;
}

.book-name{
  color:#c1cec5;
  font-weight:bold;
  font-size:12px;
  margin-bottom:8px;
}

.odds-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.odd{
  background:#172019;
  border:1px solid #34453a;
  border-radius:9px;
  padding:8px;
}

.odd.best{
  border:2px solid #70d68c;
  background:#17321f;
}

.best-label{
  color:#96efad;
  font-size:8px;
  font-weight:bold;
  text-transform:uppercase;
}

.odd-name{
  font-size:11px;
  color:#b3beb6;
  margin-top:2px;
  overflow-wrap:anywhere;
}

.odd-description{
  font-size:11px;
  font-weight:bold;
  margin-top:3px;
}

.odd-price{
  font-size:16px;
  font-weight:bold;
  margin-top:4px;
}

.odd-point{
  color:#ced8d1;
  font-size:11px;
  margin-top:2px;
}

.event-btn,
.future-btn,
.prop-btn{
  width:100%;
  text-align:left;
  background:#141c17;
  border:1px solid #314137;
  color:white;
  border-radius:11px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}

.event-btn strong,
.future-btn strong{
  display:block;
  margin-bottom:4px;
}

.event-btn span,
.future-btn span{
  color:#9eada3;
  font-size:11px;
}

.prop-market-list{
  display:grid;
  gap:7px;
  margin:10px 0;
}

.prop-btn{
  margin:0;
  text-transform:none;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.action-btn{
  border:0;
  border-radius:9px;
  padding:11px 13px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn{
  background:#202b24;
  color:white;
}

.empty,
.error,
.notice{
  background:#141c17;
  border:1px solid #2b3a31;
  border-radius:11px;
  padding:14px;
  color:#b9c4bc;
}

.error{
  border-color:#713737;
  color:#f1b7b7;
}

.notice{
  font-size:12px;
  color:#a7b5ab;
  margin-bottom:10px;
}

.group-heading{
  margin:18px 0 8px;
  font-size:13px;
  color:#a8b6ad;
}

@media(min-width:700px){
  .odds-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1>GameDay Sports</h1>
    <div class="live">LIVE SPORTSBOOK</div>
  </div>
  <div class="subtitle">
    Games • Player Props • Futures • Worldwide Sports
  </div>
</header>

<main>

<div class="section-title">Featured Sports</div>

<div class="featured" id="featured">
  <button class="sport-btn active" data-sport="nfl">NFL</button>
  <button class="sport-btn" data-sport="nba">NBA</button>
  <button class="sport-btn" data-sport="wnba">WNBA</button>
  <button class="sport-btn" data-sport="mlb">MLB</button>
  <button class="sport-btn" data-sport="nhl">NHL</button>
  <button class="sport-btn" data-sport="ncaaf">NCAAF</button>
  <button class="sport-btn" data-sport="ncaab">NCAAB</button>
  <button class="sport-btn" data-sport="mls">MLS</button>
  <button class="sport-btn" data-sport="epl">EPL</button>
  <button class="sport-btn" data-sport="ucl">UCL</button>
</div>

<div class="section-title">Worldwide Sports</div>

<select class="worldwide" id="sportSelect">
  <option value="">Loading available sports...</option>
</select>

<div class="views">
  <button class="view-btn active" data-view="games">Games</button>
  <button class="view-btn" data-view="props">Player Props</button>
  <button class="view-btn" data-view="futures">Futures</button>
</div>

<div class="toolbar">
  <button class="refresh" id="refreshBtn">Refresh</button>
  <span id="status">Ready</span>
</div>

<div id="content" class="cards"></div>

</main>

<script>
const API =
"https://qsvrvhcklnsbekxblpfo.supabase.co/functions/v1/odds-proxy";

let currentSport = "nfl";
let currentView = "games";
let gameMarket = "h2h";
let latestGames = [];
let selectedEvent = null;
let propMarkets = [];

const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const sportSelect = document.getElementById("sportSelect");
const refreshBtn = document.getElementById("refreshBtn");

async function api(body){
  const response = await fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  });

  const data = await response.json();

  if(!response.ok){
    throw new Error(
      data.detail ||
      data.error ||
      "Request failed"
    );
  }

  return data;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function price(value){
  if(typeof value !== "number") return "--";
  return value > 0 ? "+" + value : String(value);
}

function dateTime(value){
  if(!value) return "Time unavailable";

  return new Intl.DateTimeFormat("en-US",{
    weekday:"short",
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  }).format(new Date(value));
}

function market(book,key){
  return book?.markets?.find(x=>x.key===key);
}

function marketTitle(key){
  if(key==="h2h") return "Moneyline";
  if(key==="spreads") return "Spread";
  if(key==="totals") return "Total";

  return key
    .replaceAll("_"," ")
    .replace(/\b\w/g,c=>c.toUpperCase());
}

function allPrices(game,key){
  const list=[];

  (game.bookmakers||[]).forEach(book=>{
    const m=market(book,key);

    (m?.outcomes||[]).forEach(outcome=>{
      if(typeof outcome.price==="number"){
        list.push({
          name:outcome.name,
          point:outcome.point ?? null,
          price:outcome.price
        });
      }
    });
  });

  return list;
}

function isBest(game,key,outcome){

  const matches=allPrices(game,key).filter(x=>{
    if(x.name!==outcome.name) return false;

    if(key==="spreads" || key==="totals"){
      return x.point === (outcome.point ?? null);
    }

    return true;
  });

  if(!matches.length) return false;

  const best=Math.max(...matches.map(x=>x.price));

  return outcome.price===best;
}

function renderBook(game,book,key){

  const m=market(book,key);

  if(!m?.outcomes?.length) return "";

  return `
  <div class="book">

    <div class="book-name">
      ${escapeHtml(book.title || book.key)}
    </div>

    <div class="odds-grid">

      ${m.outcomes.map(outcome=>{

        const best=isBest(game,key,outcome);

        return `
        <div class="odd ${best ? "best":""}">

          ${best
            ? `<div class="best-label">Best Line</div>`
            : ""
          }

          <div class="odd-name">
            ${escapeHtml(outcome.name)}
          </div>

          ${outcome.description
            ? `<div class="odd-description">
                ${escapeHtml(outcome.description)}
               </div>`
            : ""
          }

          <div class="odd-price">
            ${price(outcome.price)}
          </div>

          ${outcome.point !== null &&
            outcome.point !== undefined
            ? `<div class="odd-point">
                ${escapeHtml(outcome.point)}
               </div>`
            : ""
          }

        </div>
        `;
      }).join("")}

    </div>
  </div>
  `;
}

function renderGame(game){

  return `
  <div class="card">

    <div class="card-head">

      <div class="time">
        ${dateTime(game.commence_time)}
      </div>

      <div class="team">
        <span>${escapeHtml(game.away_team)}</span>
        <span class="tag">AWAY</span>
      </div>

      <div class="team">
        <span>${escapeHtml(game.home_team)}</span>
        <span class="tag">HOME</span>
      </div>

    </div>

    <div class="market-tabs">

      <button
        class="market-btn ${gameMarket==="h2h"?"active":""}"
        onclick="changeGameMarket('h2h')">
        Moneyline
      </button>

      <button
        class="market-btn ${gameMarket==="spreads"?"active":""}"
        onclick="changeGameMarket('spreads')">
        Spread
      </button>

      <button
        class="market-btn ${gameMarket==="totals"?"active":""}"
        onclick="changeGameMarket('totals')">
        Total
      </button>

    </div>

    <div class="books">

      ${(game.bookmakers||[])
        .map(book=>renderBook(game,book,gameMarket))
        .filter(Boolean)
        .join("")
      }

    </div>
  </div>
  `;
}

function renderGames(){
  contentEl.innerHTML=
    latestGames.map(renderGame).join("");
}

function changeGameMarket(key){
  gameMarket=key;
  renderGames();
}

async function loadGames(){

  statusEl.textContent="Loading live games...";
  contentEl.innerHTML="";

  try{

    const data=await api({
      mode:"games",
      sport:currentSport
    });

    latestGames=data.games || [];

    if(!latestGames.length){

      contentEl.innerHTML=
      `<div class="empty">
        No live sportsbook games are currently available for this competition.
      </div>`;

      statusEl.textContent="Connected";
      return;
    }

    statusEl.textContent=
      latestGames.length+" games";

    renderGames();

  }catch(error){

    statusEl.textContent="Failed";

    contentEl.innerHTML=
    `<div class="error">
      ${escapeHtml(error.message)}
    </div>`;
  }
}

async function loadEvents(){

  selectedEvent=null;
  propMarkets=[];

  statusEl.textContent="Loading games for player props...";
  contentEl.innerHTML="";

  try{

    const data=await api({
      mode:"events",
      sport:currentSport
    });

    const events=data.events || [];

    if(!events.length){

      contentEl.innerHTML=
      `<div class="empty">
        No current events are available for player props.
      </div>`;

      statusEl.textContent="Connected";
      return;
    }

    statusEl.textContent=
      "Choose a matchup";

    contentEl.innerHTML=
      `<div class="notice">
        Choose a game first. GameDay will then discover which
        player-prop markets sportsbooks currently offer for that matchup.
      </div>`+
      events.map(event=>`

        <button
          class="event-btn"
          onclick='selectEvent(${JSON.stringify(event)})'>

          <strong>
            ${escapeHtml(event.away_team)}
            @
            ${escapeHtml(event.home_team)}
          </strong>

          <span>
            ${dateTime(event.commence_time)}
          </span>

        </button>

      `).join("");

  }catch(error){

    statusEl.textContent="Failed";

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;
  }
}

async function selectEvent(event){

  selectedEvent=event;

  statusEl.textContent="Finding available props...";

  contentEl.innerHTML=
    `<div class="notice">
      Checking sportsbooks for player props...
    </div>`;

  try{

    const data=await api({
      mode:"prop_markets",
      sport:currentSport,
      event_id:event.id
    });

    propMarkets=data.prop_markets || [];

    if(!propMarkets.length){

      contentEl.innerHTML=
      `<div class="action-row">
        <button class="action-btn back-btn" onclick="loadEvents()">
          ← Back to Games
        </button>
      </div>

      <div class="empty">
        No player-prop markets are currently available for this matchup.
      </div>`;

      statusEl.textContent="No props available";
      return;
    }

    renderPropMarketPicker();

  }catch(error){

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;

    statusEl.textContent="Failed";
  }
}

function renderPropMarketPicker(){

  statusEl.textContent=
    propMarkets.length+" prop markets available";

  contentEl.innerHTML=`

    <div class="card">

      <div class="card-head">

        <div class="time">
          ${dateTime(selectedEvent.commence_time)}
        </div>

        <div class="team">
          ${escapeHtml(selectedEvent.away_team)}
        </div>

        <div class="team">
          ${escapeHtml(selectedEvent.home_team)}
        </div>

      </div>

      <div class="books">

        <div class="notice">
          Choose an individual prop market, or load all currently
          available props. Loading all props can use more odds-provider requests.
        </div>

        <div class="action-row">

          <button class="action-btn back-btn" onclick="loadEvents()">
            ← Games
          </button>

          <button class="action-btn" onclick="loadAllProps()">
            Load All Props
          </button>

        </div>

        <div class="prop-market-list">

          ${propMarkets.map(key=>`
            <button
              class="prop-btn"
              onclick="loadProp('${key}')">
              ${escapeHtml(marketTitle(key))}
            </button>
          `).join("")}

        </div>

      </div>

    </div>
  `;
}

async function loadProp(key){

  statusEl.textContent=
    "Loading "+marketTitle(key)+"...";

  try{

    const data=await api({
      mode:"props",
      sport:currentSport,
      event_id:selectedEvent.id,
      markets:[key]
    });

    renderPropResults(
      data.event,
      [key]
    );

  }catch(error){

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;

    statusEl.textContent="Failed";
  }
}

async function loadAllProps(){

  if(!propMarkets.length) return;

  statusEl.textContent="Loading all available props...";

  contentEl.innerHTML=
  `<div class="notice">
    Loading props in batches. Please keep this page open.
  </div>`;

  const batches=[];

  for(let i=0;i<propMarkets.length;i+=8){
    batches.push(propMarkets.slice(i,i+8));
  }

  let mergedEvent=null;

  try{

    for(let i=0;i<batches.length;i++){

      statusEl.textContent=
        `Loading prop batch ${i+1} of ${batches.length}...`;

      const data=await api({
        mode:"props",
        sport:currentSport,
        event_id:selectedEvent.id,
        markets:batches[i]
      });

      const event=data.event;

      if(!mergedEvent){

        mergedEvent={
          ...event,
          bookmakers:[]
        };
      }

      (event.bookmakers||[]).forEach(book=>{

        let target=
          mergedEvent.bookmakers.find(
            x=>x.key===book.key
          );

        if(!target){

          target={
            ...book,
            markets:[]
          };

          mergedEvent.bookmakers.push(target);
        }

        target.markets.push(
          ...(book.markets||[])
        );
      });
    }

    renderPropResults(
      mergedEvent,
      propMarkets
    );

  }catch(error){

    statusEl.textContent="Failed";

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;
  }
}

function renderPropResults(event,keys){

  statusEl.textContent=
    "Live player props";

  const marketSections=keys.map(key=>{

    const books=(event.bookmakers||[])
      .map(book=>{

        const m=market(book,key);

        if(!m?.outcomes?.length) return "";

        return `
        <div class="book">

          <div class="book-name">
            ${escapeHtml(book.title)}
          </div>

          <div class="odds-grid">

            ${m.outcomes.map(outcome=>`

              <div class="odd">

                ${outcome.description
                  ? `<div class="odd-description">
                      ${escapeHtml(outcome.description)}
                     </div>`
                  : ""
                }

                <div class="odd-name">
                  ${escapeHtml(outcome.name)}
                </div>

                <div class="odd-price">
                  ${price(outcome.price)}
                </div>

                ${outcome.point !== null &&
                  outcome.point !== undefined
                  ? `<div class="odd-point">
                      ${escapeHtml(outcome.point)}
                     </div>`
                  : ""
                }

              </div>

            `).join("")}

          </div>

        </div>
        `;

      })
      .filter(Boolean)
      .join("");

    if(!books) return "";

    return `
      <div class="group-heading">
        ${escapeHtml(marketTitle(key))}
      </div>

      ${books}
    `;
  })
  .filter(Boolean)
  .join("");

  contentEl.innerHTML=`

    <div class="action-row">

      <button
        class="action-btn back-btn"
        onclick="renderPropMarketPicker()">
        ← Prop Markets
      </button>

      <button
        class="action-btn back-btn"
        onclick="loadEvents()">
        Change Game
      </button>

    </div>

    ${marketSections ||
      `<div class="empty">
        No prop lines were returned for these markets.
       </div>`
    }
  `;
}

async function loadFutureMarkets(){

  statusEl.textContent="Finding futures...";
  contentEl.innerHTML="";

  try{

    const data=await api({
      mode:"future_markets",
      sport:currentSport
    });

    const futures=data.futures || [];

    if(!futures.length){

      statusEl.textContent="Connected";

      contentEl.innerHTML=
      `<div class="empty">
        No futures or outright markets are currently available for this sport.
      </div>`;

      return;
    }

    statusEl.textContent=
      futures.length+" futures markets";

    contentEl.innerHTML=
      `<div class="notice">
        Choose a futures market to compare live outright odds.
      </div>`+
      futures.map(future=>`

        <button
          class="future-btn"
          onclick="loadFuture('${future.key}')">

          <strong>
            ${escapeHtml(future.title)}
          </strong>

          <span>
            ${escapeHtml(
              future.description ||
              "View futures odds"
            )}
          </span>

        </button>

      `).join("");

  }catch(error){

    statusEl.textContent="Failed";

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;
  }
}

async function loadFuture(key){

  statusEl.textContent="Loading futures odds...";

  try{

    const data=await api({
      mode:"futures",
      sport:currentSport,
      future_key:key
    });

    const items=data.futures || [];

    let html=`

      <div class="action-row">
        <button
          class="action-btn back-btn"
          onclick="loadFutureMarkets()">
          ← Futures
        </button>
      </div>

      <div class="section-title">
        ${escapeHtml(data.future?.title || "Futures")}
      </div>
    `;

    items.forEach(item=>{

      (item.bookmakers||[]).forEach(book=>{

        const outright=market(book,"outrights");

        if(!outright?.outcomes?.length) return;

        html+=`

        <div class="book">

          <div class="book-name">
            ${escapeHtml(book.title)}
          </div>

          <div class="odds-grid">

            ${outright.outcomes.map(outcome=>`

              <div class="odd">

                <div class="odd-name">
                  ${escapeHtml(outcome.name)}
                </div>

                <div class="odd-price">
                  ${price(outcome.price)}
                </div>

              </div>

            `).join("")}

          </div>

        </div>
        `;
      });
    });

    contentEl.innerHTML=
      html ||
      `<div class="empty">
        No futures odds returned.
      </div>`;

    statusEl.textContent="Live futures odds";

  }catch(error){

    statusEl.textContent="Failed";

    contentEl.innerHTML=
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;
  }
}

async function loadSports(){

  try{

    const data=await api({
      mode:"sports"
    });

    const sports=data.sports || [];

    sportSelect.innerHTML=
      `<option value="">
        Browse all available sports
       </option>`;

    const groups={};

    sports.forEach(sport=>{
      if(!groups[sport.group]){
        groups[sport.group]=[];
      }

      groups[sport.group].push(sport);
    });

    Object.keys(groups)
      .sort()
      .forEach(group=>{

        const optgroup=
          document.createElement("optgroup");

        optgroup.label=group;

        groups[group].forEach(sport=>{

          const option=
            document.createElement("option");

          option.value=sport.key;
          option.textContent=sport.title;

          optgroup.appendChild(option);
        });

        sportSelect.appendChild(optgroup);
      });

  }catch(error){

    sportSelect.innerHTML=
      `<option value="">
        Worldwide sports unavailable
       </option>`;
  }
}

function loadCurrentView(){

  if(currentView==="games"){
    loadGames();
  }

  if(currentView==="props"){
    loadEvents();
  }

  if(currentView==="futures"){
    loadFutureMarkets();
  }
}

document
.querySelectorAll(".sport-btn")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".sport-btn")
      .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    sportSelect.value="";

    currentSport=
      button.dataset.sport;

    loadCurrentView();
  });
});

document
.querySelectorAll(".view-btn")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".view-btn")
      .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    currentView=
      button.dataset.view;

    loadCurrentView();
  });
});

sportSelect.addEventListener("change",()=>{

  if(!sportSelect.value) return;

  document
    .querySelectorAll(".sport-btn")
    .forEach(btn=>btn.classList.remove("active"));

  currentSport=
    sportSelect.value;

  loadCurrentView();
});

refreshBtn.addEventListener(
  "click",
  loadCurrentView
);

loadSports();
loadGames();
</script>
