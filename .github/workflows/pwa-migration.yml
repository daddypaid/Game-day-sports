name: One-time GameDay PWA migration

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Wire GameDay installable app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path('icons')
          out.mkdir(exist_ok=True)

          for size in (192, 512):
              img = Image.new('RGB', (size, size), '#090e0b')
              d = ImageDraw.Draw(img)
              pad = int(size * 0.08)
              d.rounded_rectangle((pad, pad, size-pad, size-pad), radius=int(size*.18), fill='#163d22', outline='#69d887', width=max(3, size//64))
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', int(size*.34))
              except Exception:
                  font = ImageFont.load_default()
              text = 'GD'
              box = d.textbbox((0,0), text, font=font)
              tw, th = box[2]-box[0], box[3]-box[1]
              d.text(((size-tw)/2, (size-th)/2 - size*.025), text, fill='white', font=font)
              img.save(out / f'gameday-{size}.png', optimize=True)
          PY

      - name: Wire PWA metadata and service worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pages = [
              'gameday-sportsbook.html',
              'gameday-casino-v2.html',
              'gameday-my-bets.html',
              'gameday-auth.html',
              'gameday-blackjack.html',
              'gameday-roulette.html',
              'gameday-baccarat.html',
              'gameday-slots.html',
          ]

          head = '''\n<link rel="manifest" href="manifest.webmanifest">\n<meta name="theme-color" content="#101712">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="GameDay">\n<link rel="apple-touch-icon" href="icons/gameday-192.png">'''
          app = '\n<script src="gameday-app.js" defer></script>\n'

          for name in pages:
              path = Path(name)
              text = path.read_text()
              if 'rel="manifest" href="manifest.webmanifest"' not in text:
                  if '<head>' not in text:
                      raise SystemExit(f'<head> missing in {name}')
                  text = text.replace('<head>', '<head>' + head, 1)
              if 'src="gameday-app.js"' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'</body> missing in {name}')
                  text = text.replace('</body>', app + '</body>', 1)
              path.write_text(text)
          PY

      - name: Verify PWA wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s manifest.webmanifest
          test -s sw.js
          test -s gameday-app.js
          test -s offline.html
          test -s icons/gameday-192.png
          test -s icons/gameday-512.png
          for file in gameday-sportsbook.html gameday-casino-v2.html gameday-my-bets.html gameday-auth.html gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html; do
            grep -q 'rel="manifest" href="manifest.webmanifest"' "$file"
            grep -q 'src="gameday-app.js"' "$file"
            grep -q 'apple-mobile-web-app-capable' "$file"
          done

      - name: Commit installable app wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add icons gameday-sportsbook.html gameday-casino-v2.html gameday-my-bets.html gameday-auth.html gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html
          git commit -m "Enable GameDay installable app"
          git push origin main
