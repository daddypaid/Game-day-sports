name: GameDay Transferability Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transferability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared public configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s gameday-config.js
          test -s gameday-transfer-audit.html
          test -s gameday-config-check.html
          test -s gameday-buyer-readiness.html
          test -s scripts/gameday-transfer-config.mjs

          grep -q "environment: 'TEST'" gameday-config.js
          grep -q "blackjack: 'blackjack-test'" gameday-config.js
          grep -q "roulette: 'roulette-test'" gameday-config.js
          grep -q "baccarat: 'baccarat-test'" gameday-config.js
          grep -q "slots: 'slots-test'" gameday-config.js
          grep -q "videoPoker: 'video-poker-test'" gameday-config.js
          grep -q "threeCardPoker: 'three-card-poker-test'" gameday-config.js
          grep -q "ultimateTexasHoldem: 'ultimate-texas-holdem-test'" gameday-config.js
          grep -q "caribbeanStud: 'caribbean-stud-test'" gameday-config.js
          grep -q "buyerReadiness: 'gameday-buyer-readiness.html'" gameday-config.js

          node --check scripts/gameday-transfer-config.mjs

      - name: Validate centralized customer and operator pages
        shell: bash
        run: |
          set -euo pipefail
          centralized=(
            gameday-sportsbook.html
            gameday-casino-v2.html
            gameday-my-bets.html
            gameday-auth.html
            gameday-blackjack.html
            gameday-roulette.html
            gameday-baccarat.html
            gameday-slots.html
            gameday-video-poker.html
            gameday-bonus-poker.html
            gameday-deuces-wild.html
            gameday-three-card-poker.html
            gameday-ultimate-texas-holdem.html
            gameday-caribbean-stud.html
            gameday-control-center.html
            gameday-operator-analytics.html
            gameday-system-health.html
          )
          for file in "${centralized[@]}"; do
            test -s "$file"
            grep -q 'gameday-config.js' "$file"
            if grep -q 'qsvrvhcklnsbekxblpfo' "$file"; then
              echo "Legacy embedded project reference detected in $file"
              exit 1
            fi
          done

      - name: Validate casino function mappings
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GAMEDAY_CONFIG.functions.blackjack' gameday-blackjack.html
          grep -q 'GAMEDAY_CONFIG.functions.roulette' gameday-roulette.html
          grep -q 'GAMEDAY_CONFIG.functions.baccarat' gameday-baccarat.html
          grep -q 'GAMEDAY_CONFIG.functions.slots' gameday-slots.html
          grep -q 'GAMEDAY_CONFIG.functions.videoPoker' gameday-video-poker.html
          grep -q 'GAMEDAY_CONFIG.functions.videoPoker' gameday-bonus-poker.html
          grep -q 'GAMEDAY_CONFIG.functions.videoPoker' gameday-deuces-wild.html
          grep -q 'GAMEDAY_CONFIG.functions.threeCardPoker' gameday-three-card-poker.html
          grep -q 'GAMEDAY_CONFIG.functions.ultimateTexasHoldem' gameday-ultimate-texas-holdem.html
          grep -q 'GAMEDAY_CONFIG.functions.caribbeanStud' gameday-caribbean-stud.html

      - name: Validate buyer handoff surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -s gameday-admin-takeover.html
          test -s gameday-buyer-readiness.html
          test -s ACQUISITION-HANDOFF.md
          test -s BUYER-OVERVIEW.md
          grep -q 'Buyer Readiness' gameday-admin-takeover.html
          grep -q 'gameday-buyer-readiness.html' gameday-admin-takeover.html
          grep -q 'TEST MODE' gameday-buyer-readiness.html
          grep -q 'BUYER-OVERVIEW.md' gameday-admin-takeover.html

      - name: Block private browser credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.html' --include='*.js' --include='*.css' \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS|API_SPORTS_KEY|ODDS_API_KEY|sb_secret_[A-Za-z0-9_-]+' .; then
            echo 'Private backend credential reference detected in browser source.'
            exit 1
          fi

      - name: Confirm transfer tooling remains test-mode only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Public browser configuration only' scripts/gameday-transfer-config.mjs
          grep -q 'TEST MODE' gameday-transfer-audit.html
          grep -q 'TEST MODE' gameday-buyer-readiness.html
