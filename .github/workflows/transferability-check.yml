name: GameDay Transferability Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transferability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate current customer services and PWA resources
        run: npm run check:release
      - name: Verify current transfer package and public-config transfer
        run: node scripts/check-gameday-handoff.mjs --mode transfer
      - name: Verify release checks reject broken fixtures
        run: node --test tests/release-readiness.test.cjs
