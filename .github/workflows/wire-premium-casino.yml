name: One-time premium casino wiring

on:
  push:
    paths:
      - '.premium-casino-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire premium casino presentation
        run: python .github/scripts/wire-premium-casino.py
      - name: Commit changes
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameday-blackjack.html gameday-slots.html sw.js
          git commit -m "Upgrade GameDay Blackjack and Slots graphics"
          git push
