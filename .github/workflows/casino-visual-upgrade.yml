name: One-time GameDay casino visual upgrade

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Upgrade GameDay casino visuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade Slots and Roulette visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # ---------- SLOTS ----------
          p = Path('gameday-slots.html')
          s = p.read_text()

          s = s.replace('''  font-size:58px;\n  color:#111;\n}''','''  font-size:58px;\n  color:#111;\n  overflow:hidden;\n  position:relative;\n  transform:translateZ(0);\n}\n\n.reel.spinning{\n  animation:reelPulse .16s linear infinite;\n}\n\n@keyframes reelPulse{\n  0%{transform:translateY(-5px) scale(1.02);filter:blur(.4px)}\n  50%{transform:translateY(5px) scale(.98);filter:blur(1px)}\n  100%{transform:translateY(-5px) scale(1.02);filter:blur(.4px)}\n}''',1)

          marker = 'async function spin(){'
          helper = '''const slotSymbols=["💎","7️⃣","⭐","🔔","🍒","🍋"];\nlet slotTimer=null;\nfunction startSlotAnimation(){\n  const reels=[reel1,reel2,reel3];\n  reels.forEach(r=>r.classList.add("spinning"));\n  let tick=0;\n  slotTimer=setInterval(()=>{\n    tick++;\n    reels.forEach((r,i)=>{\n      r.textContent=slotSymbols[(tick+i*2)%slotSymbols.length];\n    });\n  },90);\n}\nfunction stopSlotAnimation(){\n  if(slotTimer){clearInterval(slotTimer);slotTimer=null;}\n  [reel1,reel2,reel3].forEach(r=>r.classList.remove("spinning"));\n}\n\n'''
          if helper.strip() not in s:
              s = s.replace(marker, helper + marker, 1)

          old = '''reel1.textContent = "🎰";\nreel2.textContent = "🎰";\nreel3.textContent = "🎰";'''
          s = s.replace(old, 'startSlotAnimation();', 1)

          final_marker = '''const spinData =\ndata.spin;\n\nreel1.textContent ='''
          s = s.replace(final_marker, '''const spinData =\ndata.spin;\n\nstopSlotAnimation();\n\nreel1.textContent =''', 1)

          catch_marker = '''}catch(error){\n\nshowMessage('''
          s = s.replace(catch_marker, '''}catch(error){\n\nstopSlotAnimation();\n\nshowMessage(''', 1)
          p.write_text(s)

          # ---------- ROULETTE ----------
          p = Path('gameday-roulette.html')
          r = p.read_text()

          r = r.replace('''  background:\n    radial-gradient(circle,#174c2c 0%,#113820 55%,#0b2817 100%);\n  border:2px solid #346e45;\n  border-radius:50%;\n  width:210px;\n  height:210px;''','''  background:\n    radial-gradient(circle at center,#163d22 0 24%,transparent 25%),\n    repeating-conic-gradient(#8f202a 0deg 9.73deg,#171717 9.73deg 19.46deg);\n  border:8px solid #8f7626;\n  border-radius:50%;\n  width:250px;\n  height:250px;\n  position:relative;''',1)

          r = r.replace('''  box-shadow:inset 0 0 25px rgba(0,0,0,.4);\n}''','''  box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 0 3px #2b3a31;\n}\n\n.wheel::before{\n  content:"▼";\n  position:absolute;\n  top:-24px;\n  left:50%;\n  transform:translateX(-50%);\n  color:#f1da88;\n  font-size:28px;\n  z-index:3;\n}\n\n.wheel.spinning{\n  animation:rouletteSpin .9s linear infinite;\n}\n\n@keyframes rouletteSpin{\n  to{transform:rotate(360deg)}\n}\n\n.wheel.spinning .wheel-result{\n  animation:counterSpin .9s linear infinite;\n}\n\n@keyframes counterSpin{\n  to{transform:rotate(-360deg)}\n}''',1)

          r = r.replace('''  grid-template-columns:repeat(6,1fr);\n  gap:5px;''','''  grid-template-columns:repeat(3,1fr);\n  gap:5px;''',1)

          r = r.replace('''  min-height:42px;\n  font-size:14px;''','''  min-height:48px;\n  font-size:15px;\n  border:1px solid #d7c56f;''',1)

          old_render = '''for(let n=0;n<=36;n++){\n\nhtml +=\n`<button\nclass="number ${numberColor(n)}"\ndata-type="number"\ndata-value="${n}">\n${n}\n</button>`;\n\n}'''
          new_render = '''const layout=[0,3,2,1,6,5,4,9,8,7,12,11,10,15,14,13,18,17,16,21,20,19,24,23,22,27,26,25,30,29,28,33,32,31,36,35,34];\nfor(const n of layout){\nhtml +=\n`<button\nclass="number ${numberColor(n)}${n===0?' zero':''}"\ndata-type="number"\ndata-value="${n}">\n${n}\n</button>`;\n}'''
          r = r.replace(old_render,new_render,1)

          # Add 0 spanning the board width
          r = r.replace('''.number.green{\n  background:#17743a;\n}''','''.number.green{\n  background:#17743a;\n}\n\n.number.zero{\n  grid-column:1/-1;\n}''',1)

          # Add wheel element reference
          r = r.replace('''const wheelResult =\ndocument.getElementById("wheelResult");''','''const wheel =\ndocument.querySelector(".wheel");\n\nconst wheelResult =\ndocument.getElementById("wheelResult");''',1)

          # Start wheel spinning with server call
          r = r.replace('''spinBtn.disabled = true;\nspinBtn.textContent = "Spinning...";''','''spinBtn.disabled = true;\nspinBtn.textContent = "Spinning...";\nwheel.classList.add("spinning");\nwheelResult.textContent="•";\nwheelResult.className="wheel-result green";''',1)

          r = r.replace('''const spin =\ndata.spin;\n\nwalletBalance =''','''const spin =\ndata.spin;\n\nwheel.classList.remove("spinning");\n\nwalletBalance =''',1)

          r = r.replace('''}catch(err){\n\nshowMessage(''','''}catch(err){\n\nwheel.classList.remove("spinning");\n\nshowMessage(''',1)

          p.write_text(r)
          PY

      - name: Verify casino upgrades
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'startSlotAnimation' gameday-slots.html
          grep -q 'reel.spinning' gameday-slots.html
          grep -q 'rouletteSpin' gameday-roulette.html
          grep -q 'class="number ${numberColor(n)}${n===0' gameday-roulette.html
          grep -q 'wheel.classList.add("spinning")' gameday-roulette.html

      - name: Commit casino upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-slots.html gameday-roulette.html
          git commit -m "Make Slots and Roulette feel like real games"
          git push origin main
