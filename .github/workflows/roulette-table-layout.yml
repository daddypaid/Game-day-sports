name: One-time Roulette casino-table layout

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  reshape:
    if: github.event.head_commit.message == 'Reshape GameDay Roulette into casino table layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reshape Roulette layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('gameday-roulette.html')
          s=p.read_text()

          # Make the table area feel like a real vertical roulette layout.
          css='''
/* GameDay casino-table composition */
.roulette-stage{
  display:grid;
  grid-template-rows:auto 1fr;
  gap:8px;
}
.roulette-table-shell{
  display:grid;
  grid-template-columns:56px 1fr;
  gap:6px;
  align-items:stretch;
}
.outside-rail{
  display:grid;
  grid-template-rows:repeat(6,1fr);
  gap:4px;
}
.outside-rail .bet-button{
  min-height:0;
  padding:4px 2px;
  font-size:11px;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  border-radius:4px;
}
.number-grid{
  grid-template-columns:repeat(3,1fr)!important;
  grid-auto-rows:minmax(26px,1fr);
  gap:2px!important;
}
.number{
  min-height:26px!important;
  border-radius:2px!important;
  font-size:12px!important;
  border:1px solid rgba(255,255,255,.38)!important;
}
.number.zero{
  grid-column:1/-1!important;
  min-height:30px!important;
  background:#12672e!important;
}
.wheel{
  width:min(47vw,190px)!important;
  height:min(47vw,190px)!important;
  margin:3px auto 6px!important;
}
.wheel-label{font-size:6.5px!important;transform-origin:center!important}
.roulette-ball{width:9px!important;height:9px!important;margin-left:-4.5px!important;margin-top:-4.5px!important}
.wheel-result{width:68px!important;height:68px!important;font-size:26px!important}
.result-text{font-size:13px!important;margin:2px 0 6px!important}
.control-card{padding:8px!important}
.control-card>label,.control-card>input,.control-card>.chips,.control-card>.bet-title{display:none!important}
.roulette-action-row{
  display:grid;
  grid-template-columns:72px 1fr 106px;
  gap:6px;
  align-items:center;
}
.roulette-stake-box{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  background:#0a110c;
  border:1px solid #34493b;
  border-radius:7px;
  font-weight:800;
}
.roulette-quick-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.roulette-quick-row button{min-height:40px!important;padding:4px!important;border-radius:20px!important}
.spin{margin-top:0!important;min-height:40px!important;font-size:13px!important}
@media(max-width:430px){
  html[data-gameday-app="standalone"] body{overflow:hidden}
  html[data-gameday-app="standalone"] main{height:calc(100dvh - 150px - 72px - env(safe-area-inset-bottom));overflow:hidden;padding-top:5px!important}
  html[data-gameday-app="standalone"] .notice{display:none!important}
  html[data-gameday-app="standalone"] #message{position:absolute;left:12px;right:12px;top:76px;z-index:60;pointer-events:none}
  html[data-gameday-app="standalone"] .roulette-stage{height:100%;grid-template-rows:198px minmax(0,1fr)}
  html[data-gameday-app="standalone"] .control-card{height:100%;overflow:hidden;display:grid;grid-template-rows:1fr auto;gap:6px}
  html[data-gameday-app="standalone"] .roulette-table-shell{min-height:0}
  html[data-gameday-app="standalone"] .number-grid{min-height:0}
  html[data-gameday-app="standalone"] .history-title,
  html[data-gameday-app="standalone"] #history{display:none!important}
}
'''
          if 'GameDay casino-table composition' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          # Wrap wheel/result as stage top if not already.
          old='''<div class="wheel">\n<div id="wheelLabels" aria-hidden="true"></div>\n<div id="rouletteBall" class="roulette-ball" aria-hidden="true"></div>\n<div id="wheelResult" class="wheel-result green">?</div>\n</div>\n\n<div id="resultText" class="result-text">\nChoose a bet\n</div>\n\n<div class="control-card">'''
          new='''<div class="roulette-stage">\n<div class="roulette-stage-top">\n<div class="wheel">\n<div id="wheelLabels" aria-hidden="true"></div>\n<div id="rouletteBall" class="roulette-ball" aria-hidden="true"></div>\n<div id="wheelResult" class="wheel-result green">?</div>\n</div>\n<div id="resultText" class="result-text">Choose a bet</div>\n</div>\n\n<div class="control-card">'''
          s=s.replace(old,new,1)

          old_out='''<div class="outside">\n\n<button class="bet-button red-bet" data-type="red">\nRed\n</button>\n\n<button class="bet-button black-bet" data-type="black">\nBlack\n</button>\n\n<button class="bet-button" data-type="odd">\nOdd\n</button>\n\n<button class="bet-button" data-type="even">\nEven\n</button>\n\n<button class="bet-button" data-type="low">\n1–18\n</button>\n\n<button class="bet-button" data-type="high">\n19–36\n</button>\n\n</div>\n\n<div class="bet-title">\nStraight Number\n</div>\n\n<div id="numbers" class="number-grid"></div>\n\n<button id="spinBtn" class="spin">\nSpin Roulette\n</button>'''
          new_out='''<div class="roulette-table-shell">\n<div class="outside-rail">\n<button class="bet-button" data-type="low">1–18</button>\n<button class="bet-button" data-type="even">EVEN</button>\n<button class="bet-button red-bet" data-type="red">RED</button>\n<button class="bet-button black-bet" data-type="black">BLACK</button>\n<button class="bet-button" data-type="odd">ODD</button>\n<button class="bet-button" data-type="high">19–36</button>\n</div>\n<div id="numbers" class="number-grid"></div>\n</div>\n\n<div class="roulette-action-row">\n<div class="roulette-stake-box" id="stakeDisplay">$25</div>\n<div class="roulette-quick-row">\n<button type="button" data-chip="10">10</button>\n<button type="button" data-chip="25">25</button>\n<button type="button" data-chip="50">50</button>\n<button type="button" data-chip="100">100</button>\n</div>\n<button id="spinBtn" class="spin">SPIN</button>\n</div>\n</div>\n</div>'''
          if old_out in s:
              s=s.replace(old_out,new_out,1)

          # Keep hidden original stake/chips functional and sync visible display.
          anchor='''document.querySelectorAll("[data-chip]").forEach(button=>{'''
          helper='''const stakeDisplay=document.getElementById("stakeDisplay");\nfunction syncStakeDisplay(){if(stakeDisplay) stakeDisplay.textContent=money(stake.value);}\nstake.addEventListener("input",syncStakeDisplay);\nsyncStakeDisplay();\n\n'''
          if helper.strip() not in s and anchor in s:
              s=s.replace(anchor,helper+anchor,1)

          # ensure quick chip callbacks refresh visible stake after click
          s=s.replace('''stake.value = button.dataset.chip;''','''stake.value = button.dataset.chip;\nsyncStakeDisplay();''')

          p.write_text(s)
          PY

      - name: Verify layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'roulette-table-shell' gameday-roulette.html
          grep -q 'outside-rail' gameday-roulette.html
          grep -q 'roulette-action-row' gameday-roulette.html
          grep -q 'stakeDisplay' gameday-roulette.html
          grep -q 'roulette-ball' gameday-roulette.html

      - name: Commit layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-roulette.html
          git commit -m "Reshape GameDay Roulette into casino table layout"
          git push origin main
