name: One-time Three Card Poker wiring

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message == 'Wire Three Card Poker into GameDay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Three Card Poker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('gameday-poker.html'); s=p.read_text()
          old='''<div class="card disabled"><div class="art casino">3 CARD</div><div class="info"><div class="title">Three Card Poker</div><div class="meta">Ante/Play and Pair Plus style table structure.</div><div class="foot"><span class="status">NEXT</span></div></div></div>'''
          new='''<a class="card" href="gameday-three-card-poker.html" style="text-decoration:none;color:inherit"><div class="art casino">3 CARD</div><div class="info"><div class="title">Three Card Poker</div><div class="meta">Ante → see your hand → Play or Fold → dealer reveal.</div><div class="foot"><span class="status connected">CONNECTED</span><span class="play">PLAY ›</span></div></div></a>'''
          if old not in s: raise SystemExit('Three Card Poker roadmap card not found')
          p.write_text(s.replace(old,new,1))
          a=Path('gameday-app.js'); t=a.read_text()
          t=t.replace("    'gameday-video-poker.html':'poker-game'\n", "    'gameday-video-poker.html':'poker-game',\n    'gameday-three-card-poker.html':'poker-game'\n",1)
          t=t.replace("'gameday-poker.html','gameday-video-poker.html'].includes(path)", "'gameday-poker.html','gameday-video-poker.html','gameday-three-card-poker.html'].includes(path)",1)
          a.write_text(t)
          PY
      - name: Verify wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="gameday-three-card-poker.html"' gameday-poker.html
          grep -q "'gameday-three-card-poker.html':'poker-game'" gameday-app.js
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-poker.html gameday-app.js
          git commit -m "Connect Three Card Poker in Poker room"
          git push origin main
