name: GameDay Customer Regression

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  customer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check:release
      - run: npm test
      - run: npm run test:slot-recovery
      - run: npm run test:slot-roundtrip
      - run: npm run test:slot-startup
      - run: npm run test:card-recovery
      - run: npm run test:casino-history
