name: One-time Caribbean Stud wiring

on:
  push:
    paths:
      - '.caribbean-stud-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire Caribbean Stud
        run: python .github/scripts/wire_caribbean_stud.py
      - name: Commit changes
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameday-poker.html gameday-app.js sw.js
          git commit -m "Wire Caribbean Stud into GameDay"
          git push
