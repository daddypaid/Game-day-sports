name: One-time wager lock cache refresh

on:
  push:
    paths:
      - '.wager-lock-cache-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump GameDay shell cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()
          if "const CACHE='gameday-shell-v16';" in s:
              s=s.replace("const CACHE='gameday-shell-v16';","const CACHE='gameday-shell-v17';")
          elif "const CACHE='gameday-shell-v17';" not in s:
              raise SystemExit('Unexpected GameDay cache version')
          p.write_text(s)
          PY
      - name: Commit cache refresh
        run: |
          set -e
          if git diff --quiet; then
            echo "Cache already refreshed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Refresh GameDay wager lock cache"
          git push
