name: One-time casino email privacy fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  privacy-fix:
    if: github.event.head_commit.message == 'Hide account email on casino tables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove email from casino game headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('gameday-blackjack.html'),
              Path('gameday-roulette.html'),
              Path('gameday-baccarat.html'),
              Path('gameday-slots.html'),
          ]

          patterns = [
              (re.compile(r'(accountStatus\.textContent\s*=\s*)currentUser\.email\s*\|\|\s*"GameDay user"\s*;'), r'\1"Signed in";'),
              (re.compile(r'(account\.textContent\s*=\s*)currentUser\.email\s*\|\|\s*"GameDay user"\s*;'), r'\1"Signed in";'),
              (re.compile(r'(account\.textContent\s*=\s*)user\.email\s*\|\|\s*"GameDay user"\s*;'), r'\1"Signed in";'),
          ]

          changed = []
          for path in files:
              text = path.read_text()
              original = text
              for pattern, replacement in patterns:
                  text = pattern.sub(replacement, text)
              if text != original:
                  path.write_text(text)
                  changed.append(path.name)

          if len(changed) != 4:
              raise SystemExit(f'Expected 4 casino pages to change, changed {len(changed)}: {changed}')

          sw = Path('sw.js')
          text = sw.read_text()
          if "const CACHE='gameday-shell-v8';" in text:
              sw.write_text(text.replace("const CACHE='gameday-shell-v8';", "const CACHE='gameday-shell-v9';", 1))
          elif "const CACHE='gameday-shell-v9';" not in text:
              raise SystemExit('Unexpected service-worker cache version')
          PY

      - name: Verify casino privacy fix
        shell: bash
        run: |
          set -euo pipefail
          for file in gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html; do
            grep -q '"Signed in";' "$file"
            if grep -Eq '(accountStatus|account)\.textContent[[:space:]]*=[[:space:]]*(currentUser|user)\.email' "$file"; then
              echo "Email is still assigned to casino header in $file"
              exit 1
            fi
          done
          grep -q "const CACHE='gameday-shell-v9';" sw.js

      - name: Commit privacy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html sw.js
          git commit -m "Keep casino account email private"
          git push origin main
