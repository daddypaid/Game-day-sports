name: Deploy Premium GameDay

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: premium-pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/launch-regression.yml
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate premium GameDay build
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            gameday-premium.html
            gameday-live.html
            gameday-sportsbook.html
            gameday-casino-v2.html
            gameday-blackjack.html
            gameday-roulette.html
            gameday-baccarat.html
            gameday-slots-lobby.html
            gameday-slots.html
            gameday-midnight-monsters-v2.html
            gameday-galactic-rebellion-v2.html
            gameday-poker.html
            gameday-jacks-or-better.html
            gameday-texas-holdem.html
            gameday-omaha.html
            gameday-seven-card-stud.html
            gameday-five-card-draw.html
            gameday-my-bets.html
            gameday-auth.html
            gameday-casino-history.html
            gameday-config.js
            gameday-config-check.html
            manifest.webmanifest
            sw.js
            gameday-premium-app.css
            gameday-premium-game-art.css
            gameday-premium-in-shell.css
            gameday-themed-slots-premium-art.css
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

          grep -q '"start_url": "./index.html"' manifest.webmanifest
          grep -q 'rel="manifest" href="manifest.webmanifest"' index.html
          grep -q "./index.html" sw.js
          grep -q "./gameday-config.js" sw.js
          grep -q "gameday-sportsbook.html" index.html
          grep -q "gameday-casino-v2.html" index.html
          grep -q "GAMEDAY_CONFIG" gameday-sportsbook.html
          grep -q "GAMEDAY_CONFIG" gameday-casino-v2.html

          grep -q 'href="gameday-texas-holdem.html"' gameday-poker.html
          grep -q 'href="gameday-omaha.html"' gameday-poker.html
          grep -q 'href="gameday-seven-card-stud.html"' gameday-poker.html
          grep -q 'href="gameday-five-card-draw.html"' gameday-poker.html
          grep -q 'href="gameday-jacks-or-better.html"' gameday-poker.html

          if grep -RInE \
            --include='*.html' --include='*.js' --include='*.css' \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS|API_SPORTS_KEY|ODDS_API_KEY|sb_secret_[A-Za-z0-9_-]+' .; then
            echo "Private backend credential reference detected in browser source."
            exit 1
          fi

      - name: Require workflow deployments after verification
        uses: actions/github-script@v7
        with:
          script: |
            const target = {owner: context.repo.owner, repo: context.repo.repo};
            const site = await github.rest.repos.getPages(target);
            if (site.data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({...target, build_type: 'workflow'});
            }
            const verified = await github.rest.repos.getPages(target);
            if (verified.data.build_type !== 'workflow') {
              throw new Error('GitHub Pages must use verified workflow deployments.');
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
