name: Deploy GameDay to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/launch-regression.yml
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical GameDay pages
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html
            gameday-sportsbook.html
            gameday-casino-v2.html
            gameday-my-bets.html
            gameday-auth.html
            gameday-casino-history.html
            gameday-blackjack.html
            gameday-roulette.html
            gameday-baccarat.html
            gameday-slots.html
            gameday-poker.html
            gameday-jacks-or-better.html
            gameday-texas-holdem.html
            gameday-omaha.html
            gameday-seven-card-stud.html
            gameday-five-card-draw.html
            gameday-config.js
            gameday-app.js
            sw.js
            manifest.webmanifest
            offline.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

          poker_pages=(
            gameday-texas-holdem.html
            gameday-omaha.html
            gameday-seven-card-stud.html
            gameday-five-card-draw.html
            gameday-jacks-or-better.html
          )
          for file in "${poker_pages[@]}"; do
            grep -q 'href="gameday-poker.html"' "$file"
            grep -q 'src="gameday-app.js"' "$file"
            grep -q 'rel="manifest" href="manifest.webmanifest"' "$file"
          done

          grep -q 'href="gameday-texas-holdem.html"' gameday-poker.html
          grep -q 'href="gameday-omaha.html"' gameday-poker.html
          grep -q 'href="gameday-seven-card-stud.html"' gameday-poker.html
          grep -q 'href="gameday-five-card-draw.html"' gameday-poker.html
          grep -q 'href="gameday-jacks-or-better.html"' gameday-poker.html

          grep -q 'gameday-texas-holdem-table.png' gameday-texas-holdem.html
          grep -q 'gameday-omaha-table.png' gameday-omaha.html
          grep -q 'gameday-seven-card-stud-table.png' gameday-seven-card-stud.html
          grep -q 'gameday-five-card-draw-table.png' gameday-five-card-draw.html

          test -s assets/card-tables/gameday-texas-holdem-table.png
          test -s assets/card-tables/gameday-omaha-table.png
          test -s assets/card-tables/gameday-seven-card-stud-table.png
          test -s assets/card-tables/gameday-five-card-draw-table.png
          test -s assets/card-tables/gameday-jacks-or-better-table.png
          test -s assets/card-tables/gameday-blackjack-table.png
          test -s assets/card-tables/gameday-baccarat-table.png

          grep -q "'gameday-poker.html':'poker'" gameday-app.js
          grep -q "'gameday-jacks-or-better.html':'poker-game'" gameday-app.js
          grep -q "'gameday-texas-holdem.html':'poker-game'" gameday-app.js
          grep -q "'gameday-omaha.html':'poker-game'" gameday-app.js
          grep -q "'gameday-seven-card-stud.html':'poker-game'" gameday-app.js
          grep -q "'gameday-five-card-draw.html':'poker-game'" gameday-app.js

          grep -q "./gameday-poker.html" sw.js
          grep -q "./gameday-jacks-or-better.html" sw.js
          grep -q "./gameday-texas-holdem.html" sw.js
          grep -q "./gameday-omaha.html" sw.js
          grep -q "./gameday-seven-card-stud.html" sw.js
          grep -q "./gameday-five-card-draw.html" sw.js

          if grep -RInE \
            --include='*.html' --include='*.js' --include='*.css' \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS|API_SPORTS_KEY|ODDS_API_KEY|sb_secret_[A-Za-z0-9_-]+' .; then
            echo "Private backend credential reference detected in browser source."
            exit 1
          fi

      - name: Verify Pages uses gated workflow deployments
        uses: actions/github-script@v7
        with:
          script: |
            const target = {owner: context.repo.owner, repo: context.repo.repo};
            const site = await github.rest.repos.getPages(target);
            if (site.data.build_type !== 'workflow') {
              throw new Error('Repository owner must set Settings > Pages > Build and deployment > Source to GitHub Actions: https://github.com/' + target.owner + '/' + target.repo + '/settings/pages');
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
