name: Deploy GameDay to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical GameDay pages
        shell: bash
        run: |
          set -euo pipefail
          required=(
            gameday-sportsbook.html
            gameday-casino-v2.html
            gameday-my-bets.html
            gameday-auth.html
            gameday-blackjack.html
            gameday-roulette.html
            gameday-baccarat.html
            gameday-slots.html
            gameday-poker.html
            gameday-video-poker.html
            gameday-three-card-poker.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required page: $file"; exit 1; }
          done
          grep -q "GameDay Sports" gameday-sportsbook.html
          grep -q "TEST MODE" gameday-sportsbook.html
          grep -q "Test Wallet" gameday-auth.html
          grep -q "GameDay Poker" gameday-poker.html
          grep -q "Jacks or Better" gameday-video-poker.html
          grep -q "video-poker-test" gameday-video-poker.html
          grep -q "Three Card Poker" gameday-three-card-poker.html
          grep -q "three-card-poker-test" gameday-three-card-poker.html
          grep -q 'href="gameday-poker.html">Poker</a>' gameday-casino-v2.html
          grep -q 'href="gameday-three-card-poker.html"' gameday-poker.html

          casino_games=(gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html)
          for file in "${casino_games[@]}"; do
            grep -q 'href="gameday-sportsbook.html">Sportsbook</a>' "$file"
            grep -q 'href="gameday-casino-v2.html">Casino</a>' "$file"
            grep -q 'href="gameday-my-bets.html">My Bets</a>' "$file"
            grep -q 'href="gameday-auth.html">Account</a>' "$file"
            grep -q 'TEST MODE' "$file"
          done

          grep -q 'async function resumeActiveHand()' gameday-blackjack.html
          grep -q 'action:"resume"' gameday-blackjack.html
          test "$(grep -c 'await resumeActiveHand();' gameday-blackjack.html)" -eq 2

          mobile_fit_pages=(gameday-blackjack.html gameday-video-poker.html gameday-three-card-poker.html)
          for file in "${mobile_fit_pages[@]}"; do
            grep -q 'iPhone compact play surface' "$file"
            grep -q '@media(max-width:430px)' "$file"
          done
          grep -q '.table{min-height:0' gameday-blackjack.html
          grep -q '.nav{display:none}' gameday-blackjack.html
          grep -q '.card{height:72px' gameday-video-poker.html
          grep -q '.card{height:64px' gameday-three-card-poker.html

          compact_casino_pages=(gameday-roulette.html gameday-baccarat.html gameday-slots.html)
          for file in "${compact_casino_pages[@]}"; do
            grep -q 'iPhone compact casino play surface' "$file"
            grep -q '@media(max-width:430px)' "$file"
            grep -q '.nav{display:none}' "$file"
          done
          grep -q '.wheel{width:172px;height:172px' gameday-roulette.html
          grep -q '.number-grid{grid-template-columns:repeat(12,1fr)' gameday-roulette.html
          grep -q '.table{min-height:0' gameday-baccarat.html
          grep -q '.card{width:46px;height:64px' gameday-baccarat.html
          grep -q '.reel{min-height:82px' gameday-slots.html
          grep -q '.spin{min-height:38px' gameday-slots.html

          pwa_required=(
            manifest.webmanifest
            sw.js
            gameday-app.js
            offline.html
            icons/gameday-192.png
            icons/gameday-512.png
          )
          for file in "${pwa_required[@]}"; do
            test -s "$file" || { echo "Missing or empty PWA file: $file"; exit 1; }
          done
          grep -q '"start_url": "./gameday-sportsbook.html"' manifest.webmanifest
          grep -q "navigator.serviceWorker.register('./sw.js'" gameday-app.js
          grep -q "'gameday-poker.html':'poker'" gameday-app.js
          grep -q "'gameday-video-poker.html':'poker-game'" gameday-app.js
          grep -q "'gameday-three-card-poker.html':'poker-game'" gameday-app.js
          grep -q "./gameday-poker.html" sw.js
          grep -q "./gameday-video-poker.html" sw.js
          grep -q "./gameday-three-card-poker.html" sw.js
          for file in "${required[@]}"; do
            grep -q 'rel="manifest" href="manifest.webmanifest"' "$file"
            grep -q 'src="gameday-app.js"' "$file"
            grep -q 'apple-mobile-web-app-capable' "$file"
          done

          if grep -RInE \
            --include='*.html' --include='*.js' --include='*.css' \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS|API_SPORTS_KEY|ODDS_API_KEY|sb_secret_[A-Za-z0-9_-]+' .; then
            echo "Private backend credential reference detected in browser source."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
