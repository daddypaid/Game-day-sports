name: One-time Roulette and Baccarat screen-fit upgrade

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Make Roulette and Baccarat fit the app screen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade Roulette and Baccarat presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # ---------------- ROULETTE ----------------
          p=Path('gameday-roulette.html')
          s=p.read_text()

          css_anchor='''@keyframes counterSpin{\n  to{transform:rotate(-360deg)}\n}\n'''
          css_add='''@keyframes counterSpin{\n  to{transform:rotate(-360deg)}\n}\n\n.wheel-label{\n  position:absolute;\n  left:50%;\n  top:50%;\n  width:22px;\n  height:16px;\n  margin-left:-11px;\n  margin-top:-8px;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  font-size:8px;\n  font-weight:800;\n  color:#fff;\n  text-shadow:0 1px 2px #000;\n  pointer-events:none;\n}\n\n.roulette-ball{\n  position:absolute;\n  left:50%;\n  top:50%;\n  width:11px;\n  height:11px;\n  margin-left:-5.5px;\n  margin-top:-5.5px;\n  border-radius:50%;\n  background:#fff;\n  border:1px solid #ddd;\n  box-shadow:0 1px 5px rgba(0,0,0,.8);\n  transform:rotate(0deg) translateY(-105px);\n  transform-origin:center;\n  z-index:4;\n  transition:transform .75s cubic-bezier(.2,.7,.15,1);\n}\n\n.wheel.spinning .roulette-ball{\n  animation:ballOrbit .32s linear infinite reverse;\n}\n\n@keyframes ballOrbit{\n  to{transform:rotate(360deg) translateY(-105px)}\n}\n'''
          if '.roulette-ball{' not in s:
              assert css_anchor in s
              s=s.replace(css_anchor,css_add,1)

          html_anchor='''<div class="wheel">\n<div id="wheelResult" class="wheel-result green">?</div>\n</div>'''
          html_new='''<div class="wheel">\n<div id="wheelLabels" aria-hidden="true"></div>\n<div id="rouletteBall" class="roulette-ball" aria-hidden="true"></div>\n<div id="wheelResult" class="wheel-result green">?</div>\n</div>'''
          if 'id="rouletteBall"' not in s:
              assert html_anchor in s
              s=s.replace(html_anchor,html_new,1)

          js_anchor='''const wheelResult =\ndocument.getElementById("wheelResult");'''
          js_new='''const wheelLabels =\ndocument.getElementById("wheelLabels");\n\nconst rouletteBall =\ndocument.getElementById("rouletteBall");\n\nconst wheelResult =\ndocument.getElementById("wheelResult");'''
          if 'const rouletteBall' not in s:
              assert js_anchor in s
              s=s.replace(js_anchor,js_new,1)

          fn_anchor='''function renderNumbers(){\n'''
          fn_add='''function buildWheelLabels(){\n  if(!wheelLabels) return;\n  const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];\n  wheelLabels.innerHTML=order.map((n,i)=>{\n    const angle=(i/order.length)*360;\n    const cls=numberColor(n);\n    const bg=cls==='green'?'#17743a':cls==='red'?'#8f202a':'#171717';\n    return `<span class="wheel-label" style="background:${bg};transform:rotate(${angle}deg) translateY(-92px) rotate(${-angle}deg)">${n}</span>`;\n  }).join('');\n}\n\nfunction landBall(number){\n  if(!rouletteBall) return;\n  const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];\n  const idx=Math.max(0,order.indexOf(Number(number)));\n  const angle=(idx/order.length)*360;\n  rouletteBall.style.transform=`rotate(${angle}deg) translateY(-105px)`;\n}\n\nfunction renderNumbers(){\n'''
          if 'function buildWheelLabels()' not in s:
              assert fn_anchor in s
              s=s.replace(fn_anchor,fn_add,1)

          stop_anchor='''wheel.classList.remove("spinning");\n\nwalletBalance ='''
          stop_new='''wheel.classList.remove("spinning");\nlandBall(spin.winning_number);\n\nwalletBalance ='''
          if 'landBall(spin.winning_number);' not in s:
              assert stop_anchor in s
              s=s.replace(stop_anchor,stop_new,1)

          render_call='''renderNumbers();'''
          if 'buildWheelLabels();' not in s:
              idx=s.rfind(render_call)
              assert idx!=-1
              s=s[:idx]+'''buildWheelLabels();\n'''+s[idx:]

          p.write_text(s)

          # ---------------- BACCARAT ----------------
          p=Path('gameday-baccarat.html')
          s=p.read_text()

          css_anchor='''.card.red{\n  color:#b11d2a;\n}\n'''
          css_new='''.card.red{\n  color:#b11d2a;\n}\n\n.card.dealing{\n  animation:baccaratDeal .32s cubic-bezier(.2,.8,.2,1) both;\n}\n\n@keyframes baccaratDeal{\n  from{opacity:0;transform:translate(70px,-45px) rotate(12deg) scale(.86)}\n  to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}\n}\n\n.side.player-side{\n  border:1px solid rgba(80,140,235,.45);\n  border-radius:14px;\n  padding:8px;\n  background:rgba(25,58,110,.16);\n}\n\n.side.banker-side{\n  border:1px solid rgba(210,74,82,.45);\n  border-radius:14px;\n  padding:8px;\n  background:rgba(120,30,40,.15);\n}\n'''
          if '@keyframes baccaratDeal' not in s:
              assert css_anchor in s
              s=s.replace(css_anchor,css_new,1)

          # mark the two sides for table feel
          s=s.replace('<div class="side">\n\n<div class="side-title">\nPlayer','<div class="side player-side">\n\n<div class="side-title">\nPlayer',1)
          s=s.replace('<div class="side">\n\n<div class="side-title">\nBanker','<div class="side banker-side">\n\n<div class="side-title">\nBanker',1)

          fn_anchor='''function renderRound(round){\n'''
          fn_new='''function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}\n\nasync function animateRound(round){\n  playerCards.innerHTML='';\n  bankerCards.innerHTML='';\n  playerTotal.textContent='Total: —';\n  bankerTotal.textContent='Total: —';\n  resultEl.textContent='Dealing...';\n  const pc=round.player_cards||[];\n  const bc=round.banker_cards||[];\n  const max=Math.max(pc.length,bc.length);\n  for(let i=0;i<max;i++){\n    if(pc[i]){\n      const wrap=document.createElement('div');\n      wrap.innerHTML=cardHtml(pc[i]);\n      const el=wrap.firstElementChild;\n      el.classList.add('dealing');\n      playerCards.appendChild(el);\n      await wait(180);\n    }\n    if(bc[i]){\n      const wrap=document.createElement('div');\n      wrap.innerHTML=cardHtml(bc[i]);\n      const el=wrap.firstElementChild;\n      el.classList.add('dealing');\n      bankerCards.appendChild(el);\n      await wait(180);\n    }\n  }\n  renderRound(round);\n}\n\nfunction renderRound(round){\n'''
          if 'async function animateRound(round)' not in s:
              assert fn_anchor in s
              s=s.replace(fn_anchor,fn_new,1)

          play_anchor='''    renderRound(\n      data.round\n    );'''
          play_new='''    await animateRound(\n      data.round\n    );'''
          if 'await animateRound(' not in s:
              assert play_anchor in s
              s=s.replace(play_anchor,play_new,1)

          p.write_text(s)
          PY

      - name: Verify redesigned casino tables
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rouletteBall' gameday-roulette.html
          grep -q 'buildWheelLabels' gameday-roulette.html
          grep -q 'landBall(spin.winning_number)' gameday-roulette.html
          grep -q 'class="number ' gameday-roulette.html
          grep -q 'animateRound' gameday-baccarat.html
          grep -q 'baccaratDeal' gameday-baccarat.html
          grep -q 'player-side' gameday-baccarat.html
          grep -q 'banker-side' gameday-baccarat.html

      - name: Commit redesigned tables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-roulette.html gameday-baccarat.html
          git commit -m "Add roulette ball and baccarat dealing table"
          git push origin main
