name: One-time casino navigation migration

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Add casino navigation migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize casino navigation
        shell: python
        run: |
          from pathlib import Path

          files = {
              "gameday-blackjack.html": (
                  '''<div class="nav">\n\n<a href="gameday-wallet.html">\nSportsbook\n</a>\n\n<a href="gameday-settlement.html">\nWager Settlement\n</a>\n\n</div>''',
                  '''<div class="nav">\n<a href="gameday-sportsbook.html">Sportsbook</a>\n<a href="gameday-casino-v2.html">Casino</a>\n<a href="gameday-my-bets.html">My Bets</a>\n<a href="gameday-auth.html">Account</a>\n</div>'''
              ),
              "gameday-roulette.html": (
                  '''<div class="nav">\n<a href="gameday-casino.html">Casino</a>\n<a href="gameday-wallet.html">Sportsbook</a>\n</div>''',
                  '''<div class="nav">\n<a href="gameday-sportsbook.html">Sportsbook</a>\n<a href="gameday-casino-v2.html">Casino</a>\n<a href="gameday-my-bets.html">My Bets</a>\n<a href="gameday-auth.html">Account</a>\n</div>'''
              ),
              "gameday-baccarat.html": (
                  '''<div class="nav">\n  <a href="gameday-casino.html">Casino</a>\n  <a href="gameday-wallet.html">Sportsbook</a>\n</div>''',
                  '''<div class="nav">\n  <a href="gameday-sportsbook.html">Sportsbook</a>\n  <a href="gameday-casino-v2.html">Casino</a>\n  <a href="gameday-my-bets.html">My Bets</a>\n  <a href="gameday-auth.html">Account</a>\n</div>'''
              ),
              "gameday-slots.html": (
                  '''<div class="nav">\n<a href="gameday-casino.html">Casino</a>\n<a href="gameday-wallet.html">Sportsbook</a>\n</div>''',
                  '''<div class="nav">\n<a href="gameday-sportsbook.html">Sportsbook</a>\n<a href="gameday-casino-v2.html">Casino</a>\n<a href="gameday-my-bets.html">My Bets</a>\n<a href="gameday-auth.html">Account</a>\n</div>'''
              ),
          }

          for filename, (old, new) in files.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected navigation block not found in {filename}")
              text = text.replace(old, new, 1)
              old_grid = "grid-template-columns:repeat(2,1fr);"
              if old_grid not in text:
                  raise SystemExit(f"Expected navigation grid not found in {filename}")
              text = text.replace(old_grid, "grid-template-columns:repeat(4,1fr);", 1)
              marker = "</style>"
              mobile = "\n@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}.nav a{font-size:12px;padding:10px 6px}}\n"
              if mobile not in text:
                  text = text.replace(marker, mobile + marker, 1)
              path.write_text(text)

      - name: Verify navigation only
        shell: bash
        run: |
          set -euo pipefail
          for f in gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html; do
            grep -q 'href="gameday-sportsbook.html">Sportsbook</a>' "$f"
            grep -q 'href="gameday-casino-v2.html">Casino</a>' "$f"
            grep -q 'href="gameday-my-bets.html">My Bets</a>' "$f"
            grep -q 'href="gameday-auth.html">Account</a>' "$f"
            grep -q 'TEST MODE' "$f"
          done

      - name: Commit navigation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daddypaid"
          git config user.email "daddypaid@gmail.com"
          git add gameday-blackjack.html gameday-roulette.html gameday-baccarat.html gameday-slots.html
          git commit -m "Standardize casino game navigation"
          git push origin main
