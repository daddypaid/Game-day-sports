name: One-time compact remaining casino

on:
  push:
    paths:
      - '.casino-mobile-fit-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compact mobile casino patch
        run: python .github/scripts/compact_remaining_casino.py
      - name: Commit changes
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameday-roulette.html gameday-baccarat.html gameday-slots.html
          git commit -m "Fit remaining casino games on iPhone"
          git push
