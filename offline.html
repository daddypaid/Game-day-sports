<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101712">
<title>GameDay Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090e0b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{max-width:520px;width:100%;background:#131b16;border:1px solid #2b3a31;border-radius:18px;padding:24px;text-align:center}h1{margin:0 0 10px;font-size:28px}.muted{color:#aab6ae;line-height:1.5}.badge{display:inline-block;margin-bottom:16px;padding:6px 10px;border-radius:999px;background:#433514;border:1px solid #735d22;color:#f2db88;font-size:11px;font-weight:bold}button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:14px;background:#eef5f0;color:#07100a;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="card"><div class="badge">GAME DAY APP</div><h1>You’re offline</h1><div class="muted">GameDay needs an internet connection for live odds, account balances, wagers, and casino play. Reconnect and try again.</div><button onclick="location.reload()">Try Again</button></div>
</body>
</html>
