<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDay Sports V2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #111814;
      border-bottom: 1px solid #26332b;
      position: sticky;
      top: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      color: #9aac9f;
      margin-top: 6px;
      font-size: 13px;
    }

    main {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .tab {
      border: 1px solid #33463a;
      background: #151d18;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: white;
      color: #0b0f0d;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .refresh {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      color: #aab6ad;
      font-size: 14px;
    }

    .games {
      display: grid;
      gap: 14px;
    }

    .game {
      background: #141c17;
      border: 1px solid #27372d;
      border-radius: 14px;
      overflow: hidden;
    }

    .game-header {
      padding: 14px;
      border-bottom: 1px solid #26332b;
    }

    .time {
      color: #94a399;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .team {
      font-size: 17px;
      font-weight: bold;
      margin: 5px 0;
    }

    .book {
      padding: 14px;
    }

    .book-name {
      color: #aab6ad;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .market {
      margin-bottom: 12px;
    }

    .market-title {
      color: #8e9d93;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .odds {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .odd {
      background: #0d1410;
      border: 1px solid #2b3b31;
      border-radius: 10px;
      padding: 10px;
    }

    .odd-name {
      font-size: 12px;
      color: #aeb9b1;
    }

    .odd-price {
      margin-top: 4px;
      font-size: 16px;
      font-weight: bold;
    }

    .error,
    .empty {
      padding: 16px;
      border-radius: 12px;
      background: #151d18;
      color: #b8c2bb;
    }

    .error {
      color: #f2b0b0;
      border: 1px solid #703434;
    }
  </style>
</head>

<body>

<header>
  <h1>GameDay Sports</h1>
  <div class="subtitle">Live sportsbook odds</div>
</header>

<main>

  <div class="tabs">
    <button class="tab active" data-sport="nfl">NFL</button>
    <button class="tab" data-sport="nba">NBA</button>
    <button class="tab" data-sport="mlb">MLB</button>
    <button class="tab" data-sport="nhl">NHL</button>
  </div>

  <div class="topbar">
    <button class="refresh" onclick="loadOdds()">Refresh Odds</button>
    <span id="status">Ready</span>
  </div>

  <div id="games" class="games"></div>

</main>

<script>
  const ODDS_PROXY =
    "https://qsvrvhcklnsbekxblpfo.supabase.co/functions/v1/odds-proxy";

  let currentSport = "nfl";

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {

      document.querySelectorAll(".tab").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      currentSport = button.dataset.sport;

      loadOdds();
    });
  });

  function formatOdds(price) {
    if (typeof price !== "number") return "--";
    return price > 0 ? "+" + price : price;
  }

  function formatTime(time) {
    return new Date(time).toLocaleString();
  }

  function getMarket(bookmaker, key) {
    if (!bookmaker || !bookmaker.markets) return null;

    return bookmaker.markets.find(market => market.key === key);
  }

  function renderMarket(market, title) {
    if (!market || !market.outcomes || market.outcomes.length === 0) {
      return "";
    }

    return `
      <div class="market">

        <div class="market-title">
          ${title}
        </div>

        <div class="odds">

          ${market.outcomes.map(outcome => `
            <div class="odd">

              <div class="odd-name">
                ${outcome.name}
              </div>

              <div class="odd-price">
                ${outcome.point !== null && outcome.point !== undefined
                  ? outcome.point + " "
                  : ""
                }

                ${formatOdds(outcome.price)}
              </div>

            </div>
          `).join("")}

        </div>

      </div>
    `;
  }

  function renderGame(game) {

    const bookmaker =
      game.bookmakers && game.bookmakers.length
        ? game.bookmakers[0]
        : null;

    return `
      <div class="game">

        <div class="game-header">

          <div class="time">
            ${formatTime(game.commence_time)}
          </div>

          <div class="team">
            ${game.away_team}
          </div>

          <div class="team">
            ${game.home_team}
          </div>

        </div>

        <div class="book">

          ${
            bookmaker
            ? `
              <div class="book-name">
                ${bookmaker.title}
              </div>

              ${renderMarket(
                getMarket(bookmaker, "h2h"),
                "Moneyline"
              )}

              ${renderMarket(
                getMarket(bookmaker, "spreads"),
                "Spread"
              )}

              ${renderMarket(
                getMarket(bookmaker, "totals"),
                "Total"
              )}
            `
            : `
              <div class="empty">
                No sportsbook lines available yet.
              </div>
            `
          }

        </div>

      </div>
    `;
  }

  async function loadOdds() {

    const status = document.getElementById("status");
    const games = document.getElementById("games");

    status.textContent =
      "Loading " + currentSport.toUpperCase() + "...";

    games.innerHTML = "";

    try {

      const response = await fetch(ODDS_PROXY, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          sport: currentSport
        })

      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "HTTP " + response.status
        );
      }

      if (!data.games || data.games.length === 0) {

        status.textContent =
          "Connected";

        games.innerHTML = `
          <div class="empty">
            No ${currentSport.toUpperCase()} games available right now.
          </div>
        `;

        return;
      }

      status.textContent =
        data.games.length +
        " " +
        currentSport.toUpperCase() +
        " games";

      games.innerHTML =
        data.games.map(renderGame).join("");

    } catch (error) {

      status.textContent =
        "Connection failed";

      games.innerHTML = `
        <div class="error">
          ${error.message}
        </div>
      `;
    }
  }

  loadOdds();
</script>

</body>
</html>
