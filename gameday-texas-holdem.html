<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08100b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameDay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/gameday-192.png">
<title>GameDay Texas Hold’em</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08100b;color:#fff;font-family:Arial,sans-serif}
body{padding-bottom:92px}
header{background:#101712;border-bottom:1px solid #27342c;padding:max(10px,env(safe-area-inset-top)) 12px 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:23px}
.badge{flex:0 0 auto;background:#252c27;border:1px solid #465149;color:#c4cec7;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900}
.back{display:inline-flex;margin-top:8px;text-decoration:none;color:#f3df93;font-size:11px;font-weight:900}
main{max-width:760px;margin:auto;padding:0}
.stage{border:0;border-radius:0;overflow:hidden;background:#050706;box-shadow:none;outline:0}
.stage img{display:block;width:100%;height:auto;object-fit:contain}
.note{margin-top:10px;padding:10px 11px;border:1px solid #2c3931;border-radius:11px;background:#101612;color:#aab5ae;font-size:11px;line-height:1.4}
@media(max-width:430px){h1{font-size:20px}main{padding:0}.stage{border-radius:0}}
/* Keep approved poker table artwork free of added frames in every app view. */
html:root body.poker-table-artwork-page{background:#08100b!important}
html:root body.poker-table-artwork-page main{padding:0!important}
html:root body.poker-table-artwork-page :is(.stage,.game-stage,.stage img,.game-stage img){border:0!important;border-radius:0!important;outline:0!important;box-shadow:none!important}
</style>
<link rel="stylesheet" href="gameday-table-wager.css">
<link rel="stylesheet" href="gameday-standard-deck.css">
<link rel="stylesheet" href="gameday-table-dealing.css">
</head>
<body class="poker-table-artwork-page">
<header>
  <div class="top"><h1>GameDay Texas Hold’em</h1><div class="badge">BUILDING · CARD PREVIEW</div></div>
  <a class="back" href="gameday-poker.html">‹ Back to Poker Room</a>
</header>
<main>
  <section class="stage" aria-label="Texas Hold’em work area">
    <img src="assets/card-tables/gameday-texas-holdem-table.png" alt="GameDay Texas Hold’em table artwork" fetchpriority="high">
  </section>
  <div class="note">Card preview: deal through the river to see your best five-card hand. Opponents and betting are still building. Chips do not place wagers or change your wallet.</div>
</main>
<script src="gameday-app.js" defer></script>
<script src="gameday-table-wager.js" defer></script>
<script src="gameday-poker-hand-evaluation.js" defer></script>
<script src="gameday-table-dealing.js" defer></script>
</body>
</html>
