<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameDay My Bets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e0b;color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#101712;border-bottom:1px solid #27342c;padding:14px}h1{margin:0;font-size:23px}.sub{margin-top:5px;color:#94a198;font-size:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.nav a{text-decoration:none;text-align:center;padding:10px 6px;border-radius:9px;background:#202b24;color:#fff;font-weight:bold;font-size:12px}.nav a.active{background:#eef5f0;color:#07100a}main{max-width:760px;margin:auto;padding:14px}.status,.empty,.error{border-radius:11px;padding:13px;margin-bottom:12px;background:#141c17;border:1px solid #2b3a31;color:#b9c4bc}.error{border-color:#733b3b;color:#efb4b4}.section{margin:18px 0 8px;color:#91a097;font-size:12px;font-weight:bold;text-transform:uppercase}.bet{background:#131b16;border:1px solid #2c3b31;border-radius:13px;padding:13px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px}.small{margin-top:6px;color:#8f9d94;font-size:11px}.pill{display:inline-block;margin-top:7px;border-radius:999px;padding:5px 8px;background:#222d26;font-size:11px;font-weight:bold}.refresh{width:100%;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;margin-bottom:12px}@media(max-width:430px){.nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>GameDay Sports</h1><div class="sub">My Bets</div><div class="nav"><a href="gameday-wallet.html">Sportsbook</a><a href="gameday-casino-v2.html">Casino</a><a class="active" href="gameday-my-bets.html">My Bets</a><a href="gameday-auth.html">Account</a></div></header>
<main>
<div id="status" class="status">Checking your GameDay account...</div>
<button id="refresh" class="refresh">Refresh Bets</button>
<div class="section">Open Bets</div><div id="openBets"></div>
<div class="section">Settled Bets</div><div id="settledBets"></div>
</main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://qsvrvhcklnsbekxblpfo.supabase.co","sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0");
const statusEl=document.getElementById('status'),openEl=document.getElementById('openBets'),settledEl=document.getElementById('settledBets');
function money(v){return '$'+Number(v||0).toFixed(2)}function dt(v){return v?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'—'}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function card(w){return `<div class="bet"><div class="row"><strong>${esc(String(w.wager_type||'Bet').toUpperCase())}</strong><strong>${money(w.stake)}</strong></div><div class="row" style="margin-top:7px"><span>Potential return</span><strong>${money(w.potential_return)}</strong></div><div class="pill">${esc(String(w.status||'pending').toUpperCase())}</div><div class="small">Placed ${dt(w.placed_at)}${w.settled_at?' • Settled '+dt(w.settled_at):''}</div></div>`}
async function load(){const{data:s,error:e}=await supabase.auth.getSession();if(e||!s.session){statusEl.textContent='Sign in to view your bets.';openEl.innerHTML='<div class="empty">No account session found.</div>';settledEl.innerHTML='';return}statusEl.textContent=s.session.user.email||'Signed in';const{data,error}=await supabase.from('wagers').select('id,wager_type,stake,potential_return,status,placed_at,settled_at,is_test').eq('is_test',true).order('placed_at',{ascending:false});if(error){openEl.innerHTML='<div class="error">Unable to load bets.</div>';settledEl.innerHTML='';return}const open=(data||[]).filter(w=>!['won','lost','void','settled'].includes(String(w.status).toLowerCase()));const settled=(data||[]).filter(w=>['won','lost','void','settled'].includes(String(w.status).toLowerCase()));openEl.innerHTML=open.length?open.map(card).join(''):'<div class="empty">No open bets.</div>';settledEl.innerHTML=settled.length?settled.map(card).join(''):'<div class="empty">No settled bets.</div>'}
document.getElementById('refresh').addEventListener('click',load);supabase.auth.onAuthStateChange(load);await load();
</script>
</body>
</html>
