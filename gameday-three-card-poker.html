<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b120e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="GameDay"><link rel="apple-touch-icon" href="icons/gameday-192.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GameDay Three Card Poker</title>
<style>
*{box-sizing:border-box}:root{--line:#2b3b31;--gold:#d8bd61;--muted:#9ba79f}body{margin:0;background:radial-gradient(circle at 50% 0,#41251a 0,#17110d 30%,#080b08 100%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding-bottom:98px}header{position:sticky;top:0;z-index:20;background:rgba(12,14,11,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px;gap:12px}.title h1{margin:0;font-size:22px;line-height:1}.title div{margin-top:4px;font-size:11px;color:var(--muted)}.wallet{background:#153f24;border:1px solid #2e7040;border-radius:12px;padding:7px 10px;text-align:right}.wallet span{font-size:9px;color:#a9cdb2;font-weight:800}.wallet strong{display:block;color:#d7f3dd;font-size:14px;margin-top:2px}main{max-width:760px;margin:auto;padding:10px 12px}.status{min-height:34px;border-radius:10px;padding:9px 11px;background:#151a16;border:1px solid #2d3931;color:#bcc7c0;font-size:11px;margin-bottom:8px}.status.error{background:#321717;border-color:#7c3b3b;color:#f0b7b7}.status.win{background:#14351f;border-color:#2d7040;color:#c8f0d0}.table{background:radial-gradient(circle at 50% 35%,#146038 0,#0e4327 52%,#092c1a 100%);border:3px solid #8e7425;border-radius:24px;padding:12px 10px 14px;box-shadow:inset 0 0 35px rgba(0,0,0,.38)}.marquee{text-align:center;color:#f1d77f;font-size:18px;font-weight:900;letter-spacing:.04em}.rule{text-align:center;color:#c1d0c6;font-size:10px;margin-top:3px}.area{margin-top:12px;border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:9px}.area-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:#d8e2dc}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.card{height:118px;background:#f7f7f4;border:2px solid #ddd;border-radius:9px;color:#111;display:flex;flex-direction:column;justify-content:space-between;padding:6px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.28)}.card.red{color:#b31e28}.card.back{background:repeating-linear-gradient(45deg,#213e2d,#213e2d 7px,#315842 7px,#315842 14px);border-color:#d8bd61;display:flex;align-items:center;justify-content:center;color:#f3df95;font-size:24px}.rank{font-size:16px}.suit{font-size:31px;text-align:center}.decision{margin-top:10px;background:#111914;border:1px solid #2c3b31;border-radius:14px;padding:10px}.stake-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.stake-row label{font-size:10px;color:#9eaaa2;display:block;margin-bottom:4px}.stake-row input{width:100%;background:#08100b;color:#fff;border:1px solid #34493b;border-radius:9px;padding:10px;font-size:16px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.chips button,.actions button{border:0;border-radius:9px;font-weight:900;min-height:38px}.chips button{background:#202b24;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.deal{background:#edf4ef;color:#08100b}.play{background:#d7bd62;color:#1b1605}.fold{background:#5a2626;color:#fff}.actions button:disabled{opacity:.38}.result{text-align:center;margin-top:10px;min-height:23px;font-size:15px;font-weight:900;color:#f2dc88}.backlink{display:inline-block;margin:10px 0 0;color:#c5d0c8;text-decoration:none;font-size:11px;font-weight:800}@media(max-width:430px){.card{height:104px;padding:4px}.rank{font-size:13px}.suit{font-size:25px}}

/* iPhone compact play surface */
@media(max-width:430px){
  body{padding-bottom:70px;min-height:0} header{position:relative}
  .top{padding:7px 9px 6px;gap:6px}.title h1{font-size:18px}.title div{font-size:9px;margin-top:2px}
  .wallet{padding:5px 7px;border-radius:9px}.wallet span{font-size:8px}.wallet strong{font-size:12px;margin-top:1px}
  main{padding:5px 6px}.status{min-height:24px;padding:5px 7px;margin-bottom:4px;font-size:9px;border-radius:7px}
  .table{padding:6px 5px 7px;border-width:2px;border-radius:15px}.marquee{font-size:12px}.rule{font-size:8px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .area{margin-top:4px;padding:4px 5px;border-radius:8px}.area-title{font-size:9px}.cards{gap:4px;margin-top:4px}
  .card{height:64px;padding:3px;border-radius:6px;border-width:1px;box-shadow:none}.card.back{font-size:17px}.rank{font-size:9px}.suit{font-size:18px}
  .result{font-size:11px;min-height:14px;margin-top:4px}.decision{margin-top:4px;padding:5px;border-radius:9px}
  .stake-row{gap:4px;grid-template-columns:72px 1fr}.stake-row label{display:none}.stake-row input{padding:6px;font-size:16px;border-radius:7px;height:34px}
  .chips{gap:3px}.chips button,.actions button{min-height:34px;border-radius:7px;font-size:10px}.actions{gap:4px;margin-top:4px}.backlink{margin-top:4px;font-size:9px}
}

</style></head>
<body><header><div class="top"><div class="title"><h1>Three Card Poker</h1><div>GameDay Poker • TEST MODE</div></div><div class="wallet"><span>TEST WALLET</span><strong id="wallet">—</strong></div></div></header>
<main><div id="status" class="status">Checking account…</div><div class="table"><div class="marquee">♣ GAMEDAY THREE CARD POKER ♦</div><div class="rule">Ante → see your cards → Play or Fold • Dealer qualifies with Queen-high or better</div><div class="area"><div class="area-title"><span>DEALER</span><span id="dealerRank">Hidden</span></div><div id="dealerCards" class="cards"></div></div><div class="area"><div class="area-title"><span>YOUR HAND</span><span id="playerRank">—</span></div><div id="playerCards" class="cards"></div></div><div id="result" class="result">Ready to Deal</div></div>
<div class="decision"><div class="stake-row"><div><label for="ante">Ante</label><input id="ante" type="number" min="1" max="1000" value="25"></div><div class="chips"><button data-chip="10">10</button><button data-chip="25">25</button><button data-chip="50">50</button><button data-chip="100">100</button></div></div><div class="actions"><button id="deal" class="deal">DEAL</button><button id="play" class="play" disabled>PLAY</button><button id="fold" class="fold" disabled>FOLD</button></div></div><a class="backlink" href="gameday-poker.html">‹ Back to GameDay Poker</a></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const supabase=createClient("https://qsvrvhcklnsbekxblpfo.supabase.co","sb_publishable_-yCYGvDqIzVFgu90lgoVpw_uoWnYmO0");
let user=null,round=null,balance=0;const $=id=>document.getElementById(id),status=$('status'),wallet=$('wallet'),ante=$('ante'),deal=$('deal'),play=$('play'),fold=$('fold'),playerCards=$('playerCards'),dealerCards=$('dealerCards'),playerRank=$('playerRank'),dealerRank=$('dealerRank'),result=$('result');
function money(v){return '$'+Number(v||0).toFixed(2)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function setStatus(t,type=''){status.className='status'+(type?' '+type:'');status.textContent=t}function card(c){const red=c.suit==='♥'||c.suit==='♦';return `<div class="card ${red?'red':''}"><div class="rank">${esc(c.rank)}</div><div class="suit">${esc(c.suit)}</div><div class="rank">${esc(c.rank)}</div></div>`}function backs(){return Array.from({length:3},()=>'<div class="card back">♠</div>').join('')}function renderActive(r){playerCards.innerHTML=(r.player_hand||[]).map(card).join('');dealerCards.innerHTML=backs();playerRank.textContent='Choose Play or Fold';dealerRank.textContent='Hidden';deal.disabled=true;play.disabled=false;fold.disabled=false;ante.disabled=true;result.textContent='Your decision'}function renderDone(r){playerCards.innerHTML=(r.player_hand||[]).map(card).join('');dealerCards.innerHTML=(r.dealer_hand||[]).map(card).join('');playerRank.textContent=r.player_rank||'—';dealerRank.textContent=(r.dealer_rank||'—')+(r.dealer_qualifies?' • Qualifies':' • Does not qualify');deal.disabled=false;play.disabled=true;fold.disabled=true;ante.disabled=false;result.textContent=`${r.result} • Return ${money(r.payout)}`}
async function api(body){const{data,error}=await supabase.functions.invoke('three-card-poker-test',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}async function loadWallet(){if(!user)return;const{data,error}=await supabase.from('wallets').select('balance').eq('user_id',user.id).single();if(!error){balance=Number(data.balance||0);wallet.textContent=money(balance)}}async function resume(){try{const data=await api({action:'resume'});if(data.round){round=data.round;renderActive(round);setStatus('Signed in • active round restored')}else{round=null;playerCards.innerHTML='';dealerCards.innerHTML=backs();deal.disabled=false;play.disabled=true;fold.disabled=true;ante.disabled=false;setStatus('Signed in • ready to play')}}catch(e){setStatus(e.message||'Unable to resume','error')}}
async function dealRound(){const amount=Number(ante.value);if(!Number.isFinite(amount)||amount<=0){setStatus('Enter a valid ante','error');return}deal.disabled=true;setStatus('Dealing…');try{const data=await api({action:'deal',ante:amount});round=data.round;balance=Number(data.balance);wallet.textContent=money(balance);renderActive(round);setStatus('Cards dealt • Play costs one additional Ante')}catch(e){deal.disabled=false;setStatus(e.message||'Unable to deal','error')}}async function decide(action){if(!round)return;play.disabled=true;fold.disabled=true;setStatus(action==='play'?'Playing hand…':'Folding…');try{const data=await api({action,round_id:round.id});balance=Number(data.balance);wallet.textContent=money(balance);renderDone(data.round);round=null;setStatus(data.round.payout>0?'Round settled with return':'Round settled',data.round.payout>0?'win':'')}catch(e){play.disabled=false;fold.disabled=false;setStatus(e.message||'Unable to settle round','error')}}
document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{if(!ante.disabled)ante.value=b.dataset.chip});deal.onclick=dealRound;play.onclick=()=>decide('play');fold.onclick=()=>decide('fold');const{data,error}=await supabase.auth.getSession();if(error||!data.session){wallet.textContent='Sign in';setStatus('Sign in to your GameDay account before playing','error');dealerCards.innerHTML=backs();deal.disabled=true}else{user=data.session.user;await loadWallet();await resume()}supabase.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(!user){wallet.textContent='Sign in';setStatus('Sign in to play','error');deal.disabled=true}else{await loadWallet();await resume()}});
</script><script src="gameday-app.js" defer></script></body></html>
