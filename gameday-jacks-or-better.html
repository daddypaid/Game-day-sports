<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameDay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/gameday-192.png">
<title>GameDay Jacks or Better</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08100b;color:#fff;font-family:Arial,sans-serif}
body{padding-bottom:90px}
header{background:#101712;border-bottom:1px solid #27342c;padding:14px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:23px}
.badge{background:#433514;color:#f0d987;border:1px solid #725c21;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:bold}
.back{display:inline-flex;margin-top:8px;text-decoration:none;color:#f3df93;font-size:11px;font-weight:900}
main{max-width:760px;margin:auto;padding:14px}
.game-stage{background:#000}
.game-stage img{display:block;width:100%;height:auto;object-fit:contain}
.gd-jacks-account{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;color:#e8d89a;font-size:13px;font-weight:700;background:#08100b}
.gd-jacks-account a{color:#e8d89a}
.gd-jacks-result{margin:8px 0;padding:10px 8px;border:1px solid #a68942;border-radius:10px;background:#0a1710;text-align:center;color:#f4e4ac;font:700 14px/1.5 Arial,sans-serif;overflow-wrap:anywhere}
.gd-jacks-result span{display:block;color:#d2dcd5;font:400 12px/1.5 Arial,sans-serif}
.gd-jacks-recovery{display:block;min-height:44px;margin:8px auto;padding:8px 14px;border:1px solid #a68942;border-radius:9px;background:#173321;color:#f4e4ac;font-weight:700;cursor:pointer}
.gd-jacks-recovery[hidden],.gd-jacks-result[hidden],.gd-jacks-account [hidden]{display:none!important}
html body.jacks-artwork-page{background:#08100b!important}
@media(max-width:520px){header{padding:10px}h1{font-size:20px}}
/* Keep approved poker table artwork free of added frames in every app view. */
html:root body.poker-table-artwork-page{background:#08100b!important}
html:root body.poker-table-artwork-page main{padding:0!important}
html:root body.poker-table-artwork-page :is(.stage,.game-stage,.stage img,.game-stage img){border:0!important;border-radius:0!important;outline:0!important;box-shadow:none!important}
</style>
<link rel="stylesheet" href="gameday-table-wager.css">
<link rel="stylesheet" href="gameday-standard-deck.css">
<link rel="stylesheet" href="gameday-table-dealing.css">
<link rel="stylesheet" href="gameday-table-fullscreen.css">
</head>
<body class="jacks-artwork-page poker-table-artwork-page gd-table-fullscreen">

<main>
  <section class="game-stage" aria-label="Jacks or Better game area"><img data-table-trim-top="122" src="assets/card-tables/gameday-jacks-or-better-table.png" width="591" height="1280" alt="GameDay Jacks or Better table artwork" fetchpriority="high">
    <div class="gd-table-balance"><span id="gd-table-balance-label" class="gd-table-balance-label">BALANCE</span><output id="gd-jacks-balance" aria-labelledby="gd-table-balance-label" aria-live="polite" aria-atomic="true">—</output></div>
  </section>
<footer class="gd-table-footer" aria-label="Game account and navigation">
  <div class="gd-jacks-account"><a id="gd-jacks-signin" href="gameday-auth.html" hidden>Sign in to play</a></div>
  <a class="back" href="gameday-poker.html">‹ Back to Poker Room</a>
</footer>
</main>
<script src="gameday-app.js" defer></script>
<script src="gameday-table-wager.js" defer></script>
<script src="gameday-table-dealing.js" defer></script>
<script type="module" src="gameday-jacks-game.js"></script>
</body>
</html>
